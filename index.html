<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MyWay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#17140F;--bg2:#1E1A14;--bg3:#262019;--card:#1C1811;
  --border:rgba(245,241,232,0.08);--border2:rgba(245,241,232,0.14);
  --text:#F5F1E8;--muted:rgba(245,241,232,0.5);--muted2:rgba(245,241,232,0.24);
  --purple:#FF7A45;--purple-g:linear-gradient(135deg,#FF7A45,#E85D2B);
  --teal:#6FA86B;--amber:#E8B54A;--coral:#E85C4A;--pink:#D98878;--blue:#6B8FA3;
  --nav-h:80px;--radius:12px;--radius-sm:8px;
  --ink:#17140F;
}
body.light{
  --bg:#EFEAE1;--bg2:#E5DFD3;--bg3:#DAD2C2;--card:#FAF7F2;
  --border:rgba(26,24,21,0.08);--border2:rgba(26,24,21,0.14);
  --text:#1A1815;--muted:rgba(26,24,21,0.5);--muted2:rgba(26,24,21,0.24);
}
body.light .header{background:rgba(239,234,225,0.9);border-bottom-color:rgba(255,122,69,0.2);}
body.light .logo-text{background:linear-gradient(120deg,#1A1815 40%,rgba(255,122,69,0.9));-webkit-background-clip:text;background-clip:text;}
body.light .card{box-shadow:0 2px 14px rgba(0,0,0,0.05);}
body.light .inp{background:#fff;border-color:rgba(0,0,0,0.1);color:var(--text);}
body.light #signin-screen{background:var(--bg);}
body{background:var(--bg);color:var(--text);font-family:'Rubik',sans-serif;direction:rtl;
  min-height:100vh;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-top:env(safe-area-inset-top);overflow-x:hidden;}
.header{position:sticky;top:0;z-index:200;
  background-color:var(--bg);opacity:0.97;
  padding:12px 18px;display:flex;align-items:center;justify-content:space-between;}
.logo-icon{width:38px;height:38px;border-radius:12px;background:var(--purple-g);
  display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;
  box-shadow:0 0 20px rgba(255,122,69,0.4),0 2px 8px rgba(0,0,0,0.3);}
.logo-text{font-size:24px;font-weight:900;letter-spacing:-0.5px;
  background:linear-gradient(120deg,var(--text) 40%,rgba(255,122,69,0.85));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.logo-sub{font-size:10px;color:var(--muted);letter-spacing:0.2px;margin-top:1px}
.nav{position:fixed;bottom:12px;left:14px;right:14px;height:52px;
  background:#151210;border:1px solid rgba(245,241,232,0.08);border-radius:26px;display:flex;align-items:center;z-index:200;
  box-shadow:0 8px 28px rgba(0,0,0,0.4);padding:0 6px;}
.nb{flex:1;display:flex;align-items:center;justify-content:center;
  border:none;background:transparent;color:rgba(245,241,232,0.42);cursor:pointer;
  font-family:'Rubik',sans-serif;transition:all 0.25s;position:relative;height:38px;padding:0;}
.nb.active{color:#151210;}
.nb.active::before{content:'';position:absolute;width:34px;height:34px;border-radius:50%;
  background:var(--purple-g);box-shadow:0 4px 14px rgba(255,122,69,0.5);z-index:0;}
.ni{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;transition:transform 0.22s;flex-shrink:0;position:relative;z-index:1;}
.nb-label{display:none;}
.page{display:none;padding:14px 16px 10px;animation:fadeIn 0.25s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes pulse-glow{0%,100%{box-shadow:0 4px 20px rgba(255,122,69,0.6),0 0 0 0 rgba(255,122,69,0.35)}65%{box-shadow:0 4px 20px rgba(255,122,69,0.6),0 0 0 11px rgba(255,122,69,0)}}
.subtabs{display:flex;gap:3px;margin-bottom:14px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:3px;}
.stb{flex:1;padding:7px 5px;border-radius:6px;border:none;cursor:pointer;
  font-family:'Rubik',sans-serif;font-size:10px;font-weight:700;
  background:transparent;color:var(--muted);transition:all 0.22s;}
.stb.on{color:#151210;background:var(--purple-g);}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:15px;margin-bottom:12px;
  box-shadow:0 2px 18px rgba(0,0,0,0.2);}
.fi{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px;}
.fv{font-size:28px;font-weight:900;letter-spacing:-0.5px;line-height:1;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
.num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
.fu{font-size:10px;color:var(--muted);margin-top:2px;}
.inp{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--border2);
  background:var(--bg3);color:var(--text);font-family:'Rubik',sans-serif;font-size:13px;
  outline:none;direction:rtl;transition:border-color 0.2s,box-shadow 0.2s;}
.inp:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(255,122,69,0.12);}
.btn{padding:12px;border-radius:10px;border:none;cursor:pointer;
  font-family:'Rubik',sans-serif;font-size:13px;font-weight:800;transition:all 0.2s;letter-spacing:0.1px;}
.btn-p{background:var(--purple-g);color:#fff;box-shadow:0 4px 18px rgba(255,122,69,0.38);}
.btn-p:active{transform:scale(0.97);box-shadow:0 2px 10px rgba(255,122,69,0.22);}
.empty{text-align:center;padding:52px 20px;color:var(--muted);}
.ei{font-size:48px;margin-bottom:12px;}
.et{font-size:14px;font-weight:600;}
.es{font-size:12px;margin-top:5px;opacity:0.65;}
.toast{position:fixed;bottom:calc(var(--nav-h)+16px);left:50%;
  transform:translateX(-50%) translateY(10px);
  background:rgba(111,168,107,0.13);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(111,168,107,0.28);color:var(--teal);
  padding:10px 22px;border-radius:10px;font-size:13px;font-weight:700;
  z-index:999;opacity:0;transition:all 0.28s;pointer-events:none;white-space:nowrap;
  box-shadow:0 4px 20px rgba(111,168,107,0.12);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── SPECIAL EFFECTS ── */
/* Ripple */
.ripple-host{position:relative;overflow:hidden;}
.rwave{position:absolute;border-radius:50%;background:rgba(255,255,255,0.22);
  width:8px;height:8px;margin:-4px;pointer-events:none;
  animation:rwave-anim 0.55s ease-out forwards;}
@keyframes rwave-anim{to{transform:scale(28);opacity:0}}

/* Hero animated gradient */
@keyframes heroGrad{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

/* Score ring draw */
.score-ring-line{transition:stroke-dashoffset 1.3s cubic-bezier(0.22,1,0.36,1);}
.sketch-line{transition:stroke-dashoffset 1.1s ease-out;}

/* Number count-up handled in JS */

/* Confetti fall */
@keyframes confettiFall{
  0%{transform:translateY(0) rotate(0deg) scale(1);opacity:1}
  80%{opacity:1}
  100%{transform:translateY(90vh) rotate(600deg) scale(0.6);opacity:0}
}

/* Subtle card hover glow */
.card:hover{box-shadow:0 4px 30px rgba(255,122,69,0.13),0 2px 18px rgba(0,0,0,0.2);transition:box-shadow 0.3s;}

/* Floating orbs in hero */
@keyframes floatOrb{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(6px,-10px) scale(1.06)}}

/* Stagger entrance for list items */
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* Progress bar shimmer */
@keyframes shimmerBar{0%{background-position:200% center}100%{background-position:-200% center}}
.shimmer-bar{background:linear-gradient(90deg,transparent 25%,rgba(255,255,255,0.35) 50%,transparent 75%) !important;background-size:200% auto !important;animation:shimmerBar 1.8s linear infinite !important;}

#qcbtn{position:fixed;bottom:calc(var(--nav-h)+14px);left:16px;
  width:50px;height:50px;border-radius:50%;border:none;cursor:pointer;
  background:var(--purple-g);color:#fff;font-size:24px;
  animation:pulse-glow 2.5s ease-in-out infinite;z-index:250;
  display:flex;align-items:center;justify-content:center;}
#qcmod{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);
  z-index:500;align-items:flex-end;justify-content:center;backdrop-filter:blur(6px);}
#qcmod.open{display:flex;}
.qcbox{background:#0E1120;border-radius:10px 24px 0 0;padding:22px 20px;
  width:100%;max-width:600px;border-top:1px solid rgba(255,122,69,0.22);
  box-shadow:0 -8px 40px rgba(0,0,0,0.4);}
</style>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>
<script>if(localStorage.getItem('theme')==='light')document.body.classList.add('light');</script>
<div id="signin-screen" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:2000;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;overflow-y:auto">
  <div style="font-size:64px;margin-bottom:20px;filter:drop-shadow(0 0 20px rgba(255,122,69,0.5))">🏃</div>
  <div style="font-size:36px;font-weight:900;letter-spacing:-1px;background:linear-gradient(120deg,#fff 40%,rgba(255,122,69,0.85));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px">MyWay</div>
  <div style="font-size:14px;color:var(--muted);margin-bottom:32px">האפליקציה האישית שלך</div>
  <button onclick="signInWithGoogle()" style="display:flex;align-items:center;gap:12px;padding:14px 24px;border-radius:10px;border:1px solid var(--border2);background:var(--card);color:var(--text);font-family:Rubik,sans-serif;font-size:15px;font-weight:700;cursor:pointer;width:100%;max-width:320px;justify-content:center">
    <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20H24v8h11.3C33.6 33.1 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.7 1.1 7.8 2.9l5.7-5.7C34.1 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 19.7-8 19.7-20 0-1.3-.1-2.7-.1-4z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 15.1 18.9 12 24 12c3 0 5.7 1.1 7.8 2.9l5.7-5.7C34.1 6.5 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.9 13.5-5.1l-6.2-5.2C29.4 35.5 26.8 36 24 36c-5.2 0-9.6-2.9-11.3-7.1l-6.6 4.8C9.7 39.7 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20H24v8h11.3c-.9 2.4-2.5 4.4-4.6 5.8l6.2 5.2C40.6 35.5 44 30.2 44 24c0-1.3-.1-2.7-.4-4z"/></svg>
    המשך עם Google
  </button>
  <div style="display:flex;align-items:center;gap:10px;width:100%;max-width:320px;margin:20px 0">
    <div style="flex:1;height:1px;background:var(--border2)"></div>
    <div style="font-size:12px;color:var(--muted)">או</div>
    <div style="flex:1;height:1px;background:var(--border2)"></div>
  </div>
  <div style="display:flex;gap:4px;width:100%;max-width:320px;background:var(--card);border-radius:11px;padding:4px;border:1px solid var(--border);margin-bottom:14px">
    <button id="si-tab-login" onclick="setAuthMode('login')" style="flex:1;padding:8px;border-radius:8px;border:none;background:var(--purple-g);color:#fff;font-family:Rubik,sans-serif;font-size:13px;font-weight:700;cursor:pointer">כניסה</button>
    <button id="si-tab-register" onclick="setAuthMode('register')" style="flex:1;padding:8px;border-radius:8px;border:none;background:transparent;color:var(--muted);font-family:Rubik,sans-serif;font-size:13px;font-weight:700;cursor:pointer">הרשמה</button>
  </div>
  <div style="width:100%;max-width:320px;display:flex;flex-direction:column;gap:9px">
    <input id="si-email" type="email" placeholder="אימייל" class="inp" style="text-align:right;direction:rtl"/>
    <input id="si-pass" type="password" placeholder="סיסמה (לפחות 6 תווים)" class="inp" style="text-align:right;direction:rtl" onkeydown="if(event.key==='Enter')submitAuth()"/>
    <input id="si-pass2" type="password" placeholder="אימות סיסמה" class="inp" style="text-align:right;direction:rtl;display:none" onkeydown="if(event.key==='Enter')submitAuth()"/>
    <div id="auth-err" style="display:none;color:#E85C4A;font-size:12px;font-weight:600;text-align:center"></div>
    <button onclick="submitAuth()" class="btn btn-p" id="si-submit" style="width:100%;padding:13px;font-size:14px">כניסה</button>
  </div>
</div>

<div id="loading-screen" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:1900;flex-direction:column;align-items:center;justify-content:center">
  <div style="width:52px;height:52px;border:4px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.9s linear infinite"></div>
</div>

<div class="header">
  <div style="flex:1;text-align:center">
    <div id="page-title" style="font-size:22px;font-weight:900;letter-spacing:-0.5px">Dashboard</div>
  </div>
  <button id="theme-btn" onclick="toggleTheme()" style="position:absolute;right:16px;top:50%;transform:translateY(-50%);background:var(--bg3);border:1px solid var(--border2);border-radius:10px;width:34px;height:34px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center"></button>
  <div id="user-avatar" style="position:absolute;left:16px;top:50%;transform:translateY(-50%)"></div>
</div>

<div id="pg-dash" class="page active"></div>
<div id="pg-fitness" class="page"></div>
<div id="pg-nutrition" class="page"></div>
<div id="pg-productivity" class="page"></div>

<nav class="nav">
  <button class="nb active" data-pg="dash">
    <svg class="ni" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span class="nb-label">לוח</span>
  </button>
  <button class="nb" data-pg="fitness">
    <svg class="ni" viewBox="0 0 24 24"><path d="M6.5 6.5h11M6.5 17.5h11M3 10h18M3 14h18"/><circle cx="3" cy="10" r="1.5"/><circle cx="21" cy="10" r="1.5"/><circle cx="3" cy="14" r="1.5"/><circle cx="21" cy="14" r="1.5"/></svg><span class="nb-label">כושר</span>
  </button>
  <button class="nb" data-pg="nutrition">
    <svg class="ni" viewBox="0 0 24 24"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/></svg><span class="nb-label">תזונה</span>
  </button>
  <button class="nb" data-pg="productivity">
    <svg class="ni" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><span class="nb-label">פרוד'</span>
  </button>
</nav>

<button id="qcbtn" onclick="openQC()">+</button>
<div id="qcmod">
  <div class="qcbox">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div style="font-size:16px;font-weight:800">⚡ הוסף מהיר</div>
      <button onclick="closeQC()" style="background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer">✕</button>
    </div>
    <div style="display:flex;gap:6px;margin-bottom:12px">
      <button onclick="setQT('today')" id="qt-today" class="btn" style="flex:1;padding:8px;font-size:11px;background:var(--purple);color:#fff">📋 היום</button>
      <button onclick="setQT('tomorrow')" id="qt-tomorrow" class="btn" style="flex:1;padding:8px;font-size:11px;background:var(--bg3);color:var(--muted)">📋 מחר</button>
      <button onclick="setQT('note')" id="qt-note" class="btn" style="flex:1;padding:8px;font-size:11px;background:var(--bg3);color:var(--muted)">📝 הערה</button>
    </div>
    <textarea id="qcinp" placeholder="מה יש לך בראש?" style="width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--border2);background:var(--bg3);color:var(--text);font-family:'Rubik',sans-serif;font-size:14px;outline:none;direction:rtl;resize:none;height:75px;margin-bottom:11px"></textarea>
    <button onclick="saveQC()" class="btn btn-p" style="width:100%;font-size:14px">✓ שמור</button>
  </div>
</div>

<div id="habmod" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:500;align-items:flex-end;justify-content:center;">
  <div class="qcbox">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div style="font-size:16px;font-weight:800">✏️ הרגלים יומיים</div>
      <button onclick="closeHabitsEdit()" style="background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer">✕</button>
    </div>
    <div id="hab-list" style="margin-bottom:12px"></div>
    <div style="display:flex;gap:7px">
      <input id="hab-icon" type="text" class="inp" placeholder="😀" style="width:52px;text-align:center;font-size:18px;padding:8px"/>
      <input id="hab-label" type="text" class="inp" placeholder="הרגל חדש..." style="flex:1" onkeydown="if(event.key==='Enter')addHabit()"/>
      <button onclick="addHabit()" class="btn btn-p" style="padding:9px 14px;font-size:16px">+</button>
    </div>
  </div>
</div>

<div id="workout-edit-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:600;align-items:flex-end;justify-content:center;">
  <div style="background:#12122A;border-radius:10px 20px 0 0;padding:20px;width:100%;max-width:600px;border-top:1px solid rgba(255,122,69,0.3);max-height:88vh;overflow-y:auto">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div id="we-title" style="font-size:16px;font-weight:800"></div>
      <button onclick="closeWorkoutEdit()" style="background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer">✕</button>
    </div>
    <div id="we-content"></div>
  </div>
</div>

<div id="copy-workout-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:650;align-items:flex-end;justify-content:center;backdrop-filter:blur(6px)">
  <div style="background:#0E1120;border-radius:10px 24px 0 0;padding:22px 20px;width:100%;max-width:600px;border-top:1px solid rgba(255,122,69,0.22);box-shadow:0 -8px 40px rgba(0,0,0,0.4)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div style="font-size:15px;font-weight:800">📋 העתק אימון ליום</div>
      <button onclick="closeCopyWorkout()" style="background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer">✕</button>
    </div>
    <div id="copy-modal-days"></div>
  </div>
</div>

<div id="ex-picker-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:700;flex-direction:column;">
  <div style="padding:calc(16px + env(safe-area-inset-top)) 16px 16px;background:#12122A;border-bottom:1px solid rgba(255,122,69,0.2);flex-shrink:0">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
      <div style="font-size:16px;font-weight:800;flex:1">💪 בחר תרגיל</div>
      <button onclick="closeExPicker()" style="background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;padding:0">✕</button>

function load(k,d){try{const v=localStorage.getItem("tr_"+k);return v?JSON.parse(v):d;}catch(e){return d;}}
function save(k,v){
  try{localStorage.setItem("tr_"+k,JSON.stringify(v));}catch(e){}
  if(currentUser){
    db.collection("users").doc(currentUser.uid).set({[k]:v},{merge:true}).catch(e=>console.error("save error:",e));
  }
}
async function loadFromFirestore(uid){
  try{
    const snap=await db.collection("users").doc(uid).get();
    if(!snap.exists)return true; // brand new user
    const d=snap.data();
    ["runs","comp","nut","burns","goals","tasks","habit_log","quick_notes","journals","habits_def","visited","profile","user_plan","debrief"].forEach(k=>{
      if(d[k]!==undefined)try{localStorage.setItem("tr_"+k,JSON.stringify(d[k]));}catch(e){}
    });
    RUNS=load("runs",[]);COMP=load("comp",{});NUT=load("nut",{});
    BURNS=load("burns",{});GOALS=load("goals",{});TASKS=load("tasks",{});
    HABIT_LOG=load("habit_log",{});NOTES=load("quick_notes",[]);
    JOURNALS=load("journals",{});HABITS_DEF=load("habits_def",[]);
    WORKOUT_HIST=load("workout_hist",{});DEBRIEF=load("debrief",{});
    PROFILE=load("profile",PROFILE);USER_PLAN=load("user_plan",null);
    if(d.displayName&&!PROFILE.name){PROFILE.name=d.displayName;save("profile",PROFILE);}
    return !d.profile && !d.visited; // show onboarding only if neither profile nor visited flag exists
  }catch(e){console.error("load error:",e);return true;}
}

function getAuthError(e){
  const map={
    'auth/email-already-in-use':'כתובת האימייל כבר קיימת',
    'auth/invalid-email':'כתובת אימייל לא תקינה',
    'auth/weak-password':'הסיסמה קצרה מדי (לפחות 6 תווים)',
    'auth/user-not-found':'משתמש לא נמצא',
    'auth/wrong-password':'סיסמה שגויה',
    'auth/invalid-credential':'אימייל או סיסמה שגויים',
    'auth/too-many-requests':'יותר מדי ניסיונות. נסה שוב מאוחר יותר',
  };
  return map[e.code]||e.message;
}
function submitAuth(){
  hideAuthError();
  const email=document.getElementById('si-email').value.trim();
  const pass=document.getElementById('si-pass').value;
  if(!email||!pass){showAuthError('נא למלא אימייל וסיסמה');return;}
  if(_authMode==='register'){
    const pass2=document.getElementById('si-pass2').value;
    if(pass!==pass2){showAuthError('הסיסמאות לא תואמות');return;}
    if(pass.length<6){showAuthError('הסיסמה קצרה מדי (לפחות 6 תווים)');return;}
    auth.createUserWithEmailAndPassword(email,pass).catch(e=>showAuthError(getAuthError(e)));
  } else {

function showGoogleAuthError(e){
  if(!e)return;
  if(e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request')return;
  const errEl=document.getElementById("auth-err");
  if(!errEl)return;
  const msgs={
    'auth/unauthorized-domain':'הדומיין לא מורשה ב-Firebase — הוסף אותו ב-Firebase Console → Authentication → Authorized domains',
    'auth/popup-blocked':'הפופאפ נחסם, נסה לאפשר פופאפים בדפדפן',
    'auth/network-request-failed':'בעיית תקשורת, בדוק חיבור לאינטרנט',
    'auth/internal-error':'שגיאה פנימית, נסה שוב מאוחר יותר',
    'auth/operation-not-allowed':'כניסה עם Google אינה מופעלת ב-Firebase',
  };
  errEl.textContent=msgs[e.code]||(e.message||'שגיאת כניסה עם Google');
  errEl.style.display="block";
  console.error("google auth error:",e.code,e.message);
}
function signInWithGoogle(){
  const errEl=document.getElementById("auth-err");
  if(errEl)errEl.style.display="none";
  const provider=new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({prompt:'select_account'});
  auth.signInWithPopup(provider).catch(e=>{
    if(e.code==='auth/popup-blocked'){
      auth.signInWithRedirect(provider).catch(showGoogleAuthError);
    } else {
      showGoogleAuthError(e);
    }
  });
}

  }
  const btn=document.getElementById("auth-submit");
  if(btn){btn.textContent="...";btn.disabled=true;}

      'auth/wrong-password':'סיסמה שגויה',

      'auth/weak-password':'הסיסמה חלשה מדי (לפחות 6 תווים)',

      'auth/network-request-failed':'בעיית תקשורת, בדוק חיבור לאינטרנט',
    };
    if(errEl){errEl.textContent=msgs[e.code]||e.message;errEl.style.display="block";}

const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const todayDay=()=>DAYS[new Date().getDay()];
const fmtPace=s=>{if(!s)return"—";return Math.floor(s/60)+":"+(s%60).toString().padStart(2,"0");};
const parsePace=s=>{if(!s)return null;const p=s.split(":");return parseInt(p[0])*60+(parseInt(p[1])||0);};
const fmtDate=d=>{try{return new Date(d).toLocaleDateString("he-IL",{weekday:"short",day:"numeric",month:"numeric"});}catch(e){return d;}};
const c2r=(h,a)=>{const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return "rgba("+r+","+g+","+b+","+a+")";};
function arcGauge(pct,w,h,accentHex,n,pw,pl,opts){
  n=n||8;pw=pw||6;pl=pl||17;opts=opts||{};
  const angleOffset=opts.angleOffset||0;
  const cx=opts.cx!=null?opts.cx:w/2,cy=opts.cy!=null?opts.cy:h-2;
  const radiusRef=opts.radiusRef!=null?opts.radiusRef:w;
  const filled=Math.round(Math.max(0,Math.min(1,pct))*n);
  let petals='';
  for(let i=0;i<n;i++){
    const angle=-90+(i/(n-1))*180+angleOffset;
    const fill=i<filled?accentHex:"var(--border2)";
    petals+='<rect x="'+(cx-pw/2).toFixed(1)+'" y="'+(cy-radiusRef/2).toFixed(1)+'" width="'+pw+'" height="'+pl+'" rx="'+(pw/2)+'" fill="'+fill+'" transform="rotate('+angle.toFixed(1)+' '+cx+' '+cy+')"/>';
  }
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;display:block" preserveAspectRatio="xMidYMid meet">'+petals+'</svg>';
}

function calcStreak(){
  let s=0;const d=new Date();
  for(let i=0;i<365;i++){
    const ds=new Date(d);ds.setDate(ds.getDate()-i);
    const dstr=ds.toISOString().slice(0,10);
    const hl=HABIT_LOG[dstr]||{};
    const tl=TASKS[dstr]||[];
    if(HABITS_DEF.filter(h=>hl[h.id]).length===0&&tl.filter(t=>t.done).length===0)break;
    s++;
  }
  return s;
}

  const hl=HABIT_LOG[t]||{};
  const totalH=HABITS_DEF.length;
  const doneH=HABITS_DEF.filter(h=>hl[h.id]).length;
  // Tasks
  const tl=TASKS[t]||[];
  const totalT=tl.length;
  const doneT=tl.filter(tk=>tk.done).length;
  // Weights (proportional if category is empty)
  const w1=hasWorkout?35:0,w2=totalH>0?50:0,w3=totalT>0?15:0;
  const wTotal=w1+w2+w3;
  if(!wTotal)return 0;
  const sc=100/wTotal;
  let score=0;
  if(hasWorkout)score+=workDone*w1*sc;
  if(totalH>0)score+=(doneH/totalH)*w2*sc;
  if(totalT>0)score+=(doneT/totalT)*w3*sc;
  return Math.round(score);
}

function toggleTask(date,idx){
  if(!TASKS[date])return;
  TASKS[date][idx].done=!TASKS[date][idx].done;
  save("tasks",TASKS);renderDash();
}
function addTask(date,inputId){
  const inp=document.getElementById(inputId);
  if(!inp||!inp.value.trim())return;
  if(!TASKS[date])TASKS[date]=[];
  TASKS[date].push({id:Date.now(),text:inp.value.trim(),done:false});
  save("tasks",TASKS);inp.value="";renderDash();
}
function delTask(date,idx){
  if(TASKS[date])TASKS[date].splice(idx,1);
  save("tasks",TASKS);renderDash();
}
function toggleHabit(id,date){
  if(!HABIT_LOG[date])HABIT_LOG[date]={};
  HABIT_LOG[date][id]=!HABIT_LOG[date][id];
  save("habit_log",HABIT_LOG);renderDash();
}

function handleImgUpload(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const src=e.target.result;
    const img=new Image();
    img.onload=()=>{
      const cv=document.createElement("canvas");
      cv.width=img.naturalWidth;cv.height=img.naturalHeight;
      const ctx=cv.getContext("2d");
      ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);
      ctx.drawImage(img,0,0);
      const jpeg=cv.toDataURL("image/jpeg",0.85);
      imgB64=jpeg.split(",")[1];
      const p=document.getElementById("img-preview");
      if(p){p.src=jpeg;p.style.display="block";}
      const b=document.getElementById("analyze-btn");
      if(b)b.style.display="block";
    };
    img.src=src;
  };
  reader.readAsDataURL(file);
}

async function analyzeGarminImg(){
  if(!imgB64)return;
  const btn=document.getElementById("analyze-btn");
  const status=document.getElementById("analyze-status");
  if(btn){btn.textContent="🔍 מנתח...";btn.disabled=true;}
  try{
    const token=currentUser?await currentUser.getIdToken():"";
    const resp=await fetch("/.netlify/functions/analyze",{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},
      body:JSON.stringify({image:imgB64,mediaType:"image/jpeg"})
    });
    if(!resp.ok){const t=await resp.text();throw new Error("HTTP "+resp.status+": "+t.slice(0,100));}
    const result=await resp.json();
    if(result.error)throw new Error(result.error);
    runDraft={km:result.km||"",pace:result.pace||"",avgHr:result.avgHr||"",date:result.date||todayStr()};
    document.getElementById("adate").value=runDraft.date;
    if(result.km)document.getElementById("akm").value=result.km;
    if(result.pace)document.getElementById("apace").value=result.pace;
    if(result.avgHr)document.getElementById("ahr").value=result.avgHr;
    const details=document.getElementById("run-details");if(details)details.style.display="block";
    const hint=document.getElementById("run-details-hint");if(hint)hint.style.display="none";

  }catch(e){
    if(status)status.innerHTML='<div style="background:rgba(232,92,74,0.1);border:1px solid rgba(232,92,74,0.3);border-radius:9px;padding:9px 12px;font-size:11px;color:#E85C4A">שגיאה: '+esc(e.message)+'</div>';
  }

function handleSplitsUpload(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const cv=document.createElement("canvas");
      cv.width=img.naturalWidth;cv.height=img.naturalHeight;
      const ctx=cv.getContext("2d");
      ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);
      ctx.drawImage(img,0,0);
      const jpeg=cv.toDataURL("image/jpeg",0.85);
      imgSplitsB64=jpeg.split(",")[1];
      const p=document.getElementById("splits-preview");
      if(p){p.src=jpeg;p.style.display="block";}
      const b=document.getElementById("splits-analyze-btn");
      if(b)b.style.display="block";
      const lbl=document.getElementById("splits-upload-lbl");
      if(lbl)lbl.style.display="none";
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

async function analyzeSplitsImg(){
  if(!imgSplitsB64)return;
  const btn=document.getElementById("splits-analyze-btn");
  const status=document.getElementById("splits-status");
  if(btn){btn.textContent="🔍 מנתח splits...";btn.disabled=true;}
  try{
    const token=currentUser?await currentUser.getIdToken():"";
    const resp=await fetch("/.netlify/functions/analyze",{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},
      body:JSON.stringify({type:"splits",image:imgSplitsB64,mediaType:"image/jpeg"})
    });
    if(!resp.ok){const t=await resp.text();throw new Error("HTTP "+resp.status+": "+t.slice(0,100));}
    const result=await resp.json();
    if(result.error)throw new Error(result.error);
    pendingSplits=result.splits||[];
    if(status){
      let rows=pendingSplits.map((s,i)=>'<div style="display:flex;gap:8px;font-size:11px;padding:4px 0;border-bottom:1px solid rgba(245,241,232,0.05)">'+
        '<span style="color:var(--muted);min-width:22px">'+s.lap+'</span>'+
        '<span style="min-width:50px;color:var(--teal)">'+(s.dist?s.dist+' ק"מ':'')+'</span>'+
        '<span style="min-width:50px;color:var(--purple)">'+(s.pace?s.pace+'/ק"מ':'')+'</span>'+
        '<span style="color:var(--amber)">'+(s.hr?'♥'+s.hr:'')+'</span>'+
        '</div>').join('');
      status.innerHTML='<div style="background:rgba(111,168,107,0.08);border:1px solid rgba(111,168,107,0.25);border-radius:10px;padding:10px 12px">'+
        '<div style="font-size:11px;font-weight:700;color:var(--teal);margin-bottom:7px">✓ זוהו '+pendingSplits.length+' splits</div>'+rows+'</div>';
    }
  }catch(e){
    if(status)status.innerHTML='<div style="background:rgba(232,92,74,0.1);border:1px solid rgba(232,92,74,0.3);border-radius:9px;padding:9px;font-size:11px;color:var(--coral)">שגיאה: '+esc(e.message)+'</div>';
  }
  if(btn){btn.textContent="🔍 נתח שוב";btn.disabled=false;}
}

function delRun(id){
  if(!confirm('למחוק?'))return;
  RUNS=RUNS.filter(r=>r.id!==id);
  save('runs',RUNS);renderFitness();
}
function delStrLog(id){
  if(!confirm('למחוק?'))return;
  STR_LOG=STR_LOG.filter(s=>s.id!==id);
  save('str_log',STR_LOG);renderFitness();
}

function submitRun(){
  const km=document.getElementById("akm")?.value;
  const pace=document.getElementById("apace")?.value;
  const err=document.getElementById("aerr");
  if(!km||!pace){if(err)err.style.display="block";return;}
  RUNS.unshift({
    id:Date.now(),
    date:document.getElementById("adate")?.value||todayStr(),
    type:addType,km:parseFloat(km),paceSec:parsePace(pace),
    avgHr:document.getElementById("ahr")?.value?Number(document.getElementById("ahr").value):null,
    effort:document.getElementById("aeff")?.value||"בינוני",
    notes:document.getElementById("anotes")?.value||"",
    splits:pendingSplits&&pendingSplits.length?pendingSplits:null
  });
  const runDate=document.getElementById("adate")?.value||todayStr();
  const runDay=DAYS[new Date(runDate+'T12:00:00').getDay()];
  COMP[runDate+"-"+runDay]=true;
  save("runs",RUNS);save("comp",COMP);
  imgB64=null;imgSplitsB64=null;pendingSplits=null;runDraft=null;addType=null;
  toast("✓ ריצה נשמרה ואימון סומן! 🎉");
  fitTab="history";renderFitness();
}

  const result = document.getElementById('ai-food-result');
  const errDiv = document.getElementById('ai-food-err');
  const text = input?.value?.trim();

  if(!text){
    if(errDiv){ errDiv.textContent='נא לכתוב מה אכלת'; errDiv.style.display='block'; }
    return;
  }

  if(errDiv) errDiv.style.display='none';
  if(result){ result.style.display='block'; result.innerHTML='<div style="font-size:12px;color:var(--muted)">ה-AI מחשב ערכים תזונתיים...</div>'; }
  if(btn){ btn.textContent='⏳ מנתח...'; btn.disabled=true; }

  try {
    const token=currentUser?await currentUser.getIdToken():"";
    const resp = await fetch('/.netlify/functions/analyze', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
      body: JSON.stringify({ type: 'food', text: text })
    });

      '<div style="background:var(--bg3);border-radius:9px;padding:9px;text-align:center"><div style="font-size:9px;color:var(--muted);margin-bottom:2px">קלוריות</div><div style="font-size:18px;font-weight:800;color:var(--coral)">' + esc(d.cal) + '</div></div>' +

      '<div style="background:var(--bg3);border-radius:9px;padding:9px;text-align:center"><div style="font-size:9px;color:var(--muted);margin-bottom:2px">פחמימות</div><div style="font-size:18px;font-weight:800;color:var(--teal)">' + esc(d.c) + 'g</div></div>' +
      '<div style="background:var(--bg3);border-radius:9px;padding:9px;text-align:center"><div style="font-size:9px;color:var(--muted);margin-bottom:2px">שומן</div><div style="font-size:18px;font-weight:800;color:var(--amber)">' + esc(d.f) + 'g</div></div>' +

function confirmAddFood(){
  const d = window._pendingFood;

  addFoodFromAI(d.cal, d.p, d.c, d.f, d.desc);

}

function addFoodFromAI(cal, p, c, f, desc){

      });
    }

    h+='</div>';

  h+='</div></div>';
  return h;

function renderNut(){
  const el=document.getElementById("pg-nutrition");
  const todayE=NUT[selDate]||[];
  const burnT=BURNS[selDate]||0;
  const tot=todayE.reduce((a,e)=>({cal:a.cal+e.cal,p:a.p+e.p,c:a.c+e.c,f:a.f+e.f}),{cal:0,p:0,c:0,f:0});
  const netCal=tot.cal-burnT;
  const def=PROFILE.tdee-netCal;
  const defOk=def>=300&&def<=600,defBig=def>600;
  const defColor=defOk?"#6FA86B":defBig?"#E8B54A":"#E85C4A";

  let h='<div style="display:flex;gap:5px;margin-bottom:12px">';
  [["log","📝 יומן"],["history","📊 היסטוריה"],["plan","🥗 תפריט"]].forEach(([k,l])=>{
    h+='<button onclick="nutView=\''+k+'\';renderNut()" style="flex:1;padding:8px 5px;border-radius:9px;border:none;cursor:pointer;font-family:Rubik,sans-serif;font-size:11px;font-weight:700;background:'+(nutView===k?"var(--coral)":"var(--bg2)")+';color:'+(nutView===k?"#fff":"var(--muted)")+'">'+l+'</button>';
  });
  h+='</div>';

  if(nutView==="log"){
    const isToday=selDate===todayStr();
    h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">';
    h+='<button onclick="nutChangeDay(-1)" style="width:36px;height:36px;border-radius:10px;border:1px solid var(--border2);background:var(--bg3);color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center">‹</button>';
    h+='<div style="flex:1;text-align:center;background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:8px;font-size:13px;font-weight:700">'+new Date(selDate+'T12:00:00').toLocaleDateString("he-IL",{weekday:"short",day:"numeric",month:"long"})+'</div>';
    h+='<button onclick="nutChangeDay(1)" style="width:36px;height:36px;border-radius:10px;border:1px solid var(--border2);background:var(--bg3);color:'+(isToday?"var(--muted2)":"var(--text)")+';font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;'+(isToday?"opacity:0.35;pointer-events:none":"")+'">›</button>';
    h+='</div>';

    // Calorie gauge
    const pct=Math.min(tot.cal/PROFILE.target,1.3);
    const ringColor=tot.cal>PROFILE.target?"#E85C4A":defBig?"#E8B54A":"#6FA86B";
    h+='<div class="card">';
    h+='<div style="display:flex;align-items:center;gap:16px;margin-bottom:14px">';
    h+='<div style="position:relative;width:110px;height:64px;flex-shrink:0">';
    h+=arcGauge(pct,110,64,ringColor,8);
    h+='<div style="position:absolute;top:0;right:0;text-align:right">';
    h+='<div class="num" style="font-size:18px;font-weight:700;color:var(--text)">'+Math.round(tot.cal)+'</div>';
    h+='<div style="font-size:10px;color:var(--muted)">/ '+PROFILE.target+'</div>';
    h+='</div></div>';

function setBurn(){
  const cv=document.getElementById("cburn")?.value;
  const val=cv?Number(cv):(BURN_P.find(([t])=>t===dayType)?.[1]||0);
  BURNS[selDate]=val;save("burns",BURNS);toast("✓ שריפה עודכנה");renderNut();
}
function addNut(){
  const desc=document.getElementById("nd")?.value;
  const cal=document.getElementById("nc")?.value;
  const err=document.getElementById("nerr");
  if(!desc||!cal){if(err)err.style.display="block";return;}
  if(!NUT[selDate])NUT[selDate]=[];
  NUT[selDate].push({id:Date.now(),desc,time:document.getElementById("nt")?.value||"",
    cal:Number(cal),p:Number(document.getElementById("np")?.value)||0,
    c:Number(document.getElementById("ncarb")?.value)||0,
    f:Number(document.getElementById("nf")?.value)||0});
  save("nut",NUT);toast("✓ ארוחה נשמרה! 🍽️");renderNut();
}
function delNut(idx){NUT[selDate].splice(idx,1);save("nut",NUT);renderNut();}
function quickLogFood(idx){
  const q=QUICK_FOODS[idx];if(!q)return;
  if(!NUT[selDate])NUT[selDate]=[];
  const now=new Date();
  const time=now.getHours().toString().padStart(2,"0")+":"+now.getMinutes().toString().padStart(2,"0");
  NUT[selDate].push({id:Date.now(),desc:q.e+" "+q.l,cal:q.cal,p:q.p,c:q.c,f:q.f,time});
  save("nut",NUT);toast("✓ "+q.l+" נוסף!");renderNut();
}
function quickAddProtein(g){
  if(!NUT[selDate])NUT[selDate]=[];
  const now=new Date();
  const time=now.getHours().toString().padStart(2,"0")+":"+now.getMinutes().toString().padStart(2,"0");
  NUT[selDate].push({id:Date.now(),desc:"💊 "+g+"g חלבון",cal:g*4,p:g,c:0,f:0,time});
  save("nut",NUT);toast("✓ +"+g+"g חלבון נוסף!");renderNut();
}
function nutChangeDay(delta){
  const d=new Date(selDate+'T12:00:00');
  d.setDate(d.getDate()+delta);
  const next=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  if(next<=todayStr()){selDate=next;renderNut();}
}

function buildScoreHTML(){
  const t=scoreDate;

  const dayName=DAYS[new Date(t+'T12:00:00').getDay()];
  const score=calcDayScore(t);
  const scoreHex=score>=75?"#6FA86B":score>=50?"#E8B54A":"#E85C4A";
  const scoreColor=score>=75?"var(--teal)":score>=50?"var(--amber)":"var(--coral)";
  const scoreLabel=score>=90?"יום מושלם! ⭐":score>=75?"יום מעולה! 🔥":score>=50?"יום טוב 👍":score>=30?"יום בינוני 🙂":"יש עוד לאן לגדול 💪";

  // Workout info
  const hasW=getDayWorkouts(dayName).length>0;
  const workDone=!!COMP[t+"-"+dayName];

  // Habits
  const hl=HABIT_LOG[t]||{};
  const doneH=HABITS_DEF.filter(h=>hl[h.id]).length;
  const totalH=HABITS_DEF.length;

  // Tasks
  const tl=TASKS[t]||[];
  const doneT=tl.filter(tk=>tk.done).length;

  let h='';

  // Date nav
  h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">';
  h+='<button onclick="scoreDateChange(-1)" style="width:36px;height:36px;border-radius:50%;border:1px solid var(--border2);background:var(--bg3);color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center">‹</button>';
  h+='<div style="text-align:center"><div style="font-size:14px;font-weight:800">'+fmtDate(t)+'</div><div style="font-size:10px;color:var(--muted)">'+(isToday?"היום":dayName)+'</div></div>';
  h+='<button onclick="scoreDateChange(1)" style="width:36px;height:36px;border-radius:50%;border:1px solid var(--border2);background:var(--bg3);color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:'+(isToday?"0.3":"1")+';pointer-events:'+(isToday?"none":"auto")+'">›</button>';
  h+='</div>';

  // Score gauge + label
  h+='<div style="display:flex;flex-direction:column;align-items:center;margin-bottom:18px">';
  h+='<div style="position:relative;width:200px;height:116px">';
  h+=arcGauge(score/100,200,116,scoreHex,11);

  // Breakdown

  h+='<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:11px">פירוט</div>';

    h+='<span style="flex:1;font-size:13px">אימון</span>';

    h+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:7px">';
    h+='<span style="font-size:20px">✅</span>';
    h+='<span style="flex:1;font-size:13px">הרגלים</span>';
    h+='<span style="font-size:12px;font-weight:700;color:var(--teal)">'+doneH+'/'+totalH+'</span>';
    h+='</div>';
    HABITS_DEF.forEach(hb=>{
      const done=hl[hb.id];
      h+='<div style="display:flex;align-items:center;gap:8px;padding:4px 0 4px 8px">';
      h+='<span style="font-size:14px">'+hb.icon+'</span>';
      h+='<span style="flex:1;font-size:11px;color:'+(done?"var(--text)":"var(--muted)")+'">'+(done?hb.label:'<s style="opacity:0.4">'+hb.label+'</s>')+'</span>';
      h+='<span style="font-size:13px">'+(done?"✓":"")+'</span>';
      h+='</div>';
    });
    h+='</div>';
  }

  if(tl.length>0){
    h+='<div style="padding:9px 0">';
    h+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:7px">';
    h+='<span style="font-size:20px">📋</span>';
    h+='<span style="flex:1;font-size:13px">משימות</span>';
    h+='<span style="font-size:12px;font-weight:700;color:var(--teal)">'+doneT+'/'+tl.length+'</span>';
    h+='</div>';
    tl.forEach(task=>{
      h+='<div style="display:flex;align-items:center;gap:8px;padding:4px 0 4px 8px">';
      h+='<span style="font-size:11px;flex:1;color:'+(task.done?"var(--text)":"var(--muted)")+'">'+(task.done?task.text:'<s style="opacity:0.4">'+task.text+'</s>')+'</span>';
      h+='<span style="font-size:13px;color:var(--teal)">'+(task.done?"✓":"")+'</span>';
      h+='</div>';
    });
    h+='</div>';
  }

  if(!hasW&&totalH===0&&tl.length===0){
    h+='<div style="text-align:center;padding:16px;color:var(--muted);font-size:12px">אין נתונים ליום זה</div>';
  }
  h+='</div>';

  // Debrief if exists
  const db=DEBRIEF[t];
  if(db&&(db.bad||db.improve)){
    h+='<div style="background:linear-gradient(135deg,rgba(255,122,69,0.1),rgba(107,143,163,0.06));border:1px solid rgba(255,122,69,0.25);border-radius:10px;padding:14px;margin-bottom:11px">';
    h+='<div style="font-size:11px;font-weight:800;color:var(--purple);margin-bottom:10px">🌙 תחקור היום</div>';
    if(db.bad)h+='<div style="margin-bottom:8px"><div style="font-size:10px;font-weight:700;color:var(--muted);margin-bottom:3px">מה היה פחות טוב</div><div style="font-size:12px;line-height:1.55">'+db.bad+'</div></div>';
    if(db.improve)h+='<div><div style="font-size:10px;font-weight:700;color:var(--muted);margin-bottom:3px">איך משפרים</div><div style="font-size:12px;color:var(--teal);font-weight:600;line-height:1.55">'+db.improve+'</div></div>';
    h+='</div>';
  }

  // Last 7 days history
  h+='<div class="card">';
  h+='<div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:11px">7 ימים אחרונים</div>';
  h+='<div style="display:flex;gap:5px;align-items:flex-end;height:60px;margin-bottom:8px">';
  const today=todayStr();
  for(let i=6;i>=0;i--){
    const dd=new Date();dd.setDate(dd.getDate()-i);
    const ds=dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0')+'-'+String(dd.getDate()).padStart(2,'0');
    const s=calcDayScore(ds);
    const hex=s>=75?"#6FA86B":s>=50?"#E8B54A":"#E85C4A";
    const isSelected=ds===scoreDate;
    h+='<div onclick="scoreDate=\''+ds+'\';renderProductivity()" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer">';
    h+='<div style="font-size:9px;font-weight:700;color:'+(s>0?hex:"var(--muted2)")+'">'+( s>0?s:"")+'</div>';
    h+='<div style="width:100%;border-radius:4px 4px 0 0;background:'+(s>0?hex:"rgba(245,241,232,0.07)")+';height:'+Math.max(s*0.48,4).toFixed(0)+'px;transition:height 0.3s;border-bottom:2px solid '+(isSelected?hex:"transparent")+'"></div>';
    h+='<div style="font-size:9px;color:'+(isSelected?"var(--text)":"var(--muted2)")+';font-weight:'+(isSelected?700:400)+'">'+DAYS[dd.getDay()].slice(0,2)+'</div>';
    h+='</div>';
  }
  h+='</div></div>';

  return h;
}

function buildGoalsHTML(){
  const t=todayStr();
  const todayData=GOALS[t]||{};
  const totalSet=CATS.filter(c=>todayData[c.id]?.goal).length;
  const doneCats=CATS.filter(c=>todayData[c.id]?.done).length;
  const scored=CATS.filter(c=>todayData[c.id]?.score);
  const avgScore=scored.length?Math.round(scored.reduce((s,c)=>s+(todayData[c.id]?.score||0),0)/scored.length):0;
  let h='<div style="display:flex;gap:5px;margin-bottom:11px">';
  [["today","🎯 היום"],["new","✏️ יעד חדש"],["history","📊 היסטוריה"]].forEach(([k,l])=>{
    h+='<button onclick="goalsView=\''+k+'\';renderProductivity()" style="flex:1;padding:8px 5px;border-radius:9px;border:none;cursor:pointer;font-family:Rubik,sans-serif;font-size:11px;font-weight:700;background:'+(goalsView===k?"var(--purple)":"var(--bg2)")+';color:'+(goalsView===k?"#fff":"var(--muted)")+'">'+l+'</button>';
  });
  h+='</div>';

  if(goalsView==="today"){
    h+='<input type="date" value="'+goalDate+'" onchange="goalDate=this.value;renderProductivity()" class="inp" style="margin-bottom:11px;font-size:12px"/>';
    if(totalSet>0&&goalDate===t){
      h+='<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:11px">';
      [["הושלמו",doneCats+"/"+totalSet,"var(--purple)"],["ציון",avgScore||"—",(avgScore>=7?"#6FA86B":avgScore>=5?"#E8B54A":"#E85C4A")]].forEach(([l,v,c])=>{
        h+='<div style="background:var(--card);border-radius:12px;padding:11px;text-align:center"><div style="font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:3px">'+l+'</div><div style="font-size:22px;font-weight:900;color:'+c+'">'+v+'</div></div>';
      });
      h+='</div>';
    }
    const dayData=GOALS[goalDate]||{};
    CATS.forEach(cat=>{
      const d=dayData[cat.id]||{};
      h+='<div style="background:var(--card);border:1.5px solid '+(d.done?c2r(cat.color,0.4):d.goal?"var(--border2)":"var(--border)")+';border-radius:10px;padding:13px;margin-bottom:9px">';
      h+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:'+(d.goal?"11px":"0")+'">';
      h+='<div style="width:38px;height:38px;border-radius:11px;background:'+c2r(cat.color,0.18)+';display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">'+cat.icon+'</div>';
      h+='<div style="flex:1"><div style="font-size:13px;font-weight:700;color:'+(d.goal?cat.color:"var(--muted)")+'">'+cat.label+'</div>'+(d.goal?'<div style="font-size:11px;color:var(--muted);margin-top:1px">'+d.goal+'</div>':'<div style="font-size:11px;color:var(--muted2)">לא הוגדר יעד</div>')+'</div>';
      if(d.goal){
        h+='<div style="display:flex;gap:7px;flex-shrink:0">';
        if(d.score) h+='<div style="font-size:13px;font-weight:800;color:'+(d.score>=7?"#6FA86B":d.score>=5?"#E8B54A":"#E85C4A")+'">'+d.score+'/10</div>';
        h+='<div onclick="toggleDone(\''+cat.id+'\',\''+goalDate+'\')" style="width:30px;height:30px;border-radius:50%;border:2px solid '+(d.done?cat.color:"var(--border2)")+';background:'+(d.done?c2r(cat.color,0.2):"transparent")+';display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:var(--teal)">'+(d.done?"✓":"")+'</div>';
        h+='</div>';
      }
      h+='</div>';
      if(d.goal){
        h+='<div style="border-top:1px solid rgba(245,241,232,0.05);padding-top:10px">';
        h+='<div style="font-size:11px;font-weight:600;color:var(--muted);margin-bottom:6px">הערכה (1–10)</div>';
        h+='<div style="display:flex;gap:3px;margin-bottom:8px">';
        for(let n=1;n<=10;n++){
          const sel=d.score===n;
          h+='<button onclick="setScore(\''+cat.id+'\',\''+goalDate+'\','+n+')" style="flex:1;padding:5px 0;border-radius:6px;border:1px solid '+(sel?cat.color:"rgba(245,241,232,0.08)")+';background:'+(sel?c2r(cat.color,0.2):"transparent")+';color:'+(sel?cat.color:"var(--muted)")+';font-family:Rubik,sans-serif;font-size:11px;font-weight:'+(sel?800:500)+';cursor:pointer">'+n+'</button>';
        }
        h+='</div>';
        h+='<textarea placeholder="רפלקציה..." onchange="setReflection(\''+cat.id+'\',\''+goalDate+'\',this.value)" style="width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--border2);background:var(--bg3);color:var(--text);font-family:Rubik,sans-serif;font-size:12px;outline:none;direction:rtl;resize:none;height:50px">'+( d.reflection||"")+'</textarea>';
        h+='</div>';
      }
      h+='</div>';
    });
  }
  else if(goalsView==="new"){
    const tomorrow=new Date();tomorrow.setDate(tomorrow.getDate()+1);
    const tStr=tomorrow.toISOString().slice(0,10);
    const existing=GOALS[tStr]||{};
    h+='<div style="background:rgba(255,122,69,0.08);border:1px solid rgba(255,122,69,0.2);border-radius:11px;padding:10px 13px;margin-bottom:11px;font-size:11px;color:var(--muted)">יעדים ל-<strong style="color:var(--purple)">'+fmtDate(tStr)+'</strong> · יעד ספציפי לכל קטגוריה</div>';
    CATS.forEach(cat=>{
      const cur=existing[cat.id]?.goal||"";
      h+='<div class="card">';
      h+='<div style="display:flex;align-items:center;gap:9px;margin-bottom:9px"><div style="width:34px;height:34px;border-radius:10px;background:'+c2r(cat.color,0.18)+';display:flex;align-items:center;justify-content:center;font-size:17px">'+cat.icon+'</div><div style="font-size:13px;font-weight:700;color:'+cat.color+'">'+cat.label+'</div></div>';
      h+='<input type="text" value="'+cur+'" placeholder="יעד ספציפי..." onchange="setGoal(\''+cat.id+'\',\''+tStr+'\',this.value)" class="inp" style="font-size:13px"/>';
      h+='</div>';
    });
    h+='<button onclick="saveNewGoals(\''+tStr+'\')" class="btn btn-p" style="width:100%;font-size:14px;margin-top:4px">💾 שמור יעדים למחר</button>';
  }
  else {
    const days=Object.keys(GOALS).sort((a,b)=>b.localeCompare(a));
    if(!days.length){
      h+='<div class="empty"><div class="ei">🎯</div><div class="et">עדיין אין יעדים</div></div>';
    } else {
      days.forEach(date=>{
        const d=GOALS[date];
        const cats=CATS.filter(c=>d[c.id]?.goal);
        if(!cats.length)return;
        const done=cats.filter(c=>d[c.id]?.done).length;
        const sc=cats.filter(c=>d[c.id]?.score);
        const avg=sc.length?Math.round(sc.reduce((s,c)=>s+(d[c.id]?.score||0),0)/sc.length):null;
        const avgC=avg?(avg>=7?"#6FA86B":avg>=5?"#E8B54A":"#E85C4A"):"var(--muted)";
        h+='<div onclick="goalDate=\''+date+'\';goalsView=\'today\';renderProductivity()" style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer">';
        h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px"><div style="font-size:13px;font-weight:700">'+fmtDate(date)+'</div><div style="display:flex;gap:9px">'+(avg!==null?'<span style="font-size:13px;font-weight:800;color:'+avgC+'">'+avg+'/10</span>':"")+'<span style="font-size:12px;color:var(--muted)">'+done+'/'+cats.length+' ✓</span></div></div>';
        h+='<div style="display:flex;flex-wrap:wrap;gap:5px">'+cats.map(c=>'<span style="font-size:10px;padding:2px 8px;border-radius:10px;background:'+(d[c.id]?.done?c2r(c.color,0.2):"rgba(245,241,232,0.05)")+';color:'+(d[c.id]?.done?c.color:"var(--muted)")+';font-weight:600">'+c.icon+" "+c.label+'</span>').join("")+'</div>';
        h+='</div>';
      });
    }
  }
  return h;
}

    h+='<div style="margin-bottom:10px"><div style="font-size:11px;font-weight:600;color:var(--blue);margin-bottom:4px">'+q.q+'</div>';
    h+='<textarea onchange="saveJField(\''+journalDate+'\',\''+q.id+'\',this.value)" style="width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--border2);background:var(--bg3);color:var(--text);font-family:Rubik,sans-serif;font-size:12px;outline:none;direction:rtl;resize:none;height:58px" placeholder="'+q.p+'">'+( entry[q.id]||"")+'</textarea></div>';

  // History
  const past=Object.keys(JOURNALS).sort((a,b)=>b.localeCompare(a)).slice(0,6);

    past.forEach(date=>{
      if(date===journalDate)return;
      const e=JOURNALS[date]||{};
      h+='<div onclick="journalDate=\''+date+'\';renderProductivity()" style="background:var(--card);border:1px solid var(--border);border-radius:11px;padding:10px 13px;margin-bottom:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center">';
      h+='<div style="font-size:12px;font-weight:600">'+fmtDate(date)+'</div>';
      h+='<div style="display:flex;gap:5px">'+(e.morningDone?"☀️":"")+(e.eveningDone?"🌙":"")+(e.mood?'<span style="font-size:12px;font-weight:700;color:var(--blue)"> '+e.mood+'/10</span>':"")+'</div>';
      h+='</div>';
    });
  }
  return h;
}

function getDayWorkouts(day){
  if(!USER_PLAN) return [];
  const d=USER_PLAN[day];
  if(!d) return [];
  if(Array.isArray(d)) return d;
  if(typeof d==="string") return d==="rest"?[]:[{type:d}];
  return d.type==="rest"?[]:[d];
}
function getDayPlan(day){
  return getDayWorkouts(day)[0]||{type:"rest"};
}
function getWorkout(day,idx){
  return getDayWorkouts(day)[idx]||{type:"rest"};
}
function normalizePlan(){
  if(!USER_PLAN) return;
  DAYS.forEach(d=>{
    if(!USER_PLAN[d]||USER_PLAN[d]==="rest"){USER_PLAN[d]=[];}
    else if(typeof USER_PLAN[d]==="string"){USER_PLAN[d]=[{type:USER_PLAN[d]}];}
    else if(!Array.isArray(USER_PLAN[d])){USER_PLAN[d]=USER_PLAN[d].type==="rest"?[]:[USER_PLAN[d]];}
  });
}

function initExerciseTouchDrag(){
  let tSrc=null,tTarget=null;
  document.querySelectorAll('.ex-drag-handle').forEach((handle,idx)=>{
    handle.addEventListener('touchstart',e=>{
      e.preventDefault();
      tSrc=idx;tTarget=null;
      const rows=document.querySelectorAll('.ex-drag-row');
      if(rows[idx])rows[idx].style.opacity='0.4';
    },{passive:false});
    handle.addEventListener('touchmove',e=>{
      if(tSrc===null)return;
      e.preventDefault();
      const y=e.touches[0].clientY;
      const rows=document.querySelectorAll('.ex-drag-row');
      let found=null;
      rows.forEach((r,i)=>{
        const rect=r.getBoundingClientRect();
        if(i!==tSrc&&y>=rect.top&&y<=rect.bottom)found=i;
      });
      if(found!==tTarget){
        rows.forEach((r,i)=>{
          r.style.borderColor=i===found?'var(--purple)':'transparent';
          r.style.background=i===found?'rgba(255,122,69,0.08)':'';
        });
        tTarget=found;
      }
    },{passive:false});
    handle.addEventListener('touchend',e=>{
      const rows=document.querySelectorAll('.ex-drag-row');
      rows.forEach(r=>{r.style.opacity='';r.style.borderColor='transparent';r.style.background='';});
      if(tSrc!==null&&tTarget!==null&&tSrc!==tTarget)moveExercise(tSrc,tTarget);
      tSrc=null;tTarget=null;
    });
  });
}
function addExercise(){
  normalizePlan();
  const w=USER_PLAN[weDay][weWorkoutIdx];
  if(!w.exercises) w.exercises=[];
  w.exercises.push({name:"",sets:"3",reps:"10",weight:""});
  renderWorkoutEdit();
}
function removeExercise(idx){
  normalizePlan();
  USER_PLAN[weDay][weWorkoutIdx].exercises.splice(idx,1);
  renderWorkoutEdit();
}
function moveExercise(from,to){
  normalizePlan();
  const exs=USER_PLAN[weDay][weWorkoutIdx].exercises;
  if(!exs||from<0||to<0||from>=exs.length||to>=exs.length)return;
  const[moved]=exs.splice(from,1);
  exs.splice(to,0,moved);
  renderWorkoutEdit();
}
function exDragStart(e,idx){
  exDragIdx=idx;
  e.dataTransfer.effectAllowed='move';
  setTimeout(()=>{
    const rows=document.querySelectorAll('.ex-drag-row');
    if(rows[idx])rows[idx].style.opacity='0.4';
  },0);
}
function exDragOver(e,idx){
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
}
function exDragEnter(e,idx){
  if(exDragIdx===null||exDragIdx===idx)return;
  const rows=document.querySelectorAll('.ex-drag-row');
  rows.forEach((r,i)=>{
    r.style.borderColor=i===idx?'var(--purple)':'transparent';
    r.style.background=i===idx?'rgba(255,122,69,0.08)':'';
  });
}
function exDragLeave(e,idx){
  if(!e.currentTarget.contains(e.relatedTarget)){
    const rows=document.querySelectorAll('.ex-drag-row');
    if(rows[idx]){rows[idx].style.borderColor='transparent';rows[idx].style.background='';}
  }
}
function exDrop(e,idx){
  e.preventDefault();
  if(exDragIdx===null||exDragIdx===idx){exDragIdx=null;return;}
  const from=exDragIdx;
  exDragIdx=null;
  moveExercise(from,idx);
}
function exDragEnd(){
  exDragIdx=null;
  document.querySelectorAll('.ex-drag-row').forEach(r=>{r.style.opacity='';r.style.borderColor='transparent';r.style.background='';});
}
function updateExercise(idx,field,val){
  normalizePlan();

  if(!w||!w.exercises) return;
  w.exercises[idx][field]=val;

  normalizePlan();
  const w=USER_PLAN[weDay][weWorkoutIdx];
  if(!w) return;
  w.type=type;
  if(type==="strength"&&!w.exercises) w.exercises=[];
  if(type==="run"&&!w.segments) w.segments=[];
  renderWorkoutEdit();
}
function saveWorkoutDay(){
  normalizePlan();
  const w=USER_PLAN[weDay]&&USER_PLAN[weDay][weWorkoutIdx];
  if(w&&w.type==="strength"&&w.exercises){
    w.exercises.forEach(ex=>{
      const k=(ex.name||"").trim().toLowerCase();
      if(k&&(ex.sets||ex.reps||ex.weight)){
        WORKOUT_HIST[k]={sets:ex.sets,reps:ex.reps,weight:ex.weight||"",date:todayStr()};
      }
    });
    save("workout_hist",WORKOUT_HIST);
  }
  save("user_plan",USER_PLAN);
  closeWorkoutEdit();
  toast("✓ "+weDay+" נשמר!");
  renderFitness();
}

function startWorkout(day,idx){
  normalizePlan();
  const w=USER_PLAN&&USER_PLAN[day]&&USER_PLAN[day][idx];
  if(!w||w.type!=="strength")return;
  const exs=(w.exercises||[]).map(ex=>({
    name:ex.name||"",
    plannedSets:parseInt(ex.sets)||3,
    plannedReps:ex.reps||"",
    plannedWeight:ex.weight||"",
    sets:Array.from({length:parseInt(ex.sets)||3},()=>({reps:ex.reps||"",weight:ex.weight||"",done:false}))
  }));
  activeWorkout={day,idx,startTime:Date.now(),exercises:exs};
  const modal=document.getElementById("active-workout-modal");
  document.getElementById("awo-title").textContent="💪 "+day;
  modal.style.display="flex";
  clearInterval(_workoutTimerInterval);
  _workoutTimerInterval=setInterval(tickWorkoutTimer,1000);
  renderActiveWorkout();
}

function tickWorkoutTimer(){
  if(!activeWorkout)return;
  const secs=Math.floor((Date.now()-activeWorkout.startTime)/1000);
  const m=Math.floor(secs/60).toString().padStart(2,"0");
  const s=(secs%60).toString().padStart(2,"0");
  const el=document.getElementById("awo-timer");
  if(el)el.textContent=m+":"+s;
}

function renderActiveWorkout(){
  if(!activeWorkout)return;
  let h="";
  activeWorkout.exercises.forEach((ex,ei)=>{
    const prevKey=ex.name.trim().toLowerCase();
    const prev=prevKey&&WORKOUT_HIST[prevKey]?WORKOUT_HIST[prevKey]:null;
    const doneSets=ex.sets.filter(s=>s.done).length;
    const allDone=doneSets===ex.sets.length;
    h+='<div style="background:var(--card);border:1px solid '+(allDone?"rgba(111,168,107,0.3)":"var(--border)")+';border-radius:10px;padding:13px;margin-bottom:12px">';
    h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">';
    h+='<div style="font-size:15px;font-weight:800;flex:1">'+esc(ex.name||"תרגיל")+'</div>';
    h+='<div style="font-size:11px;color:'+(allDone?"var(--teal)":"var(--muted)")+';font-weight:700">'+doneSets+'/'+ex.sets.length+' סטים</div>';
    h+='</div>';
    if(prev){
      const pw=prev.weight?(' @ '+prev.weight+'ק"ג'):'';
      const pd=prev.date?(' · '+prev.date.slice(5).replace('-','/')):'';
      h+='<div style="font-size:10px;color:var(--muted);margin-bottom:9px;display:flex;align-items:center;gap:4px">';
      h+='<span style="color:var(--purple)">↩</span>';
      h+='<span>פעם קודמת: '+(prev.sets||'')+'×'+(prev.reps||'')+pw+pd+'</span>';
      h+='</div>';
    }
    // Column headers
    h+='<div style="display:grid;grid-template-columns:28px 1fr 1fr 36px;gap:5px;margin-bottom:5px;padding:0 2px">';
    h+='<div style="font-size:9px;font-weight:700;color:var(--muted);text-align:center">סט</div>';
    h+='<div style="font-size:9px;font-weight:700;color:var(--muted);text-align:center">ק"ג</div>';
    h+='<div style="font-size:9px;font-weight:700;color:var(--muted);text-align:center">חזרות</div>';
    h+='<div></div>';
    h+='</div>';
    // Sets
    ex.sets.forEach((set,si)=>{
      const done=set.done;
      h+='<div style="display:grid;grid-template-columns:28px 1fr 1fr 36px;gap:5px;margin-bottom:5px;align-items:center">';
      h+='<div style="font-size:12px;font-weight:700;color:'+(done?"var(--teal)":"var(--muted)")+';text-align:center;background:rgba(245,241,232,0.04);border-radius:7px;height:36px;display:flex;align-items:center;justify-content:center">'+(si+1)+'</div>';
      h+='<input type="number" step="0.5" value="'+(set.weight||"")+'" oninput="updateActiveSet('+ei+','+si+',\'weight\',this.value)" class="inp" placeholder="ק\"ג" style="font-size:13px;padding:8px;text-align:center;height:36px;background:'+(done?"rgba(111,168,107,0.07)":"var(--bg3)")+';border-color:'+(done?"rgba(111,168,107,0.3)":"var(--border2)")+'">';
      h+='<input type="number" step="1" value="'+(set.reps||"")+'" oninput="updateActiveSet('+ei+','+si+',\'reps\',this.value)" class="inp" placeholder="חזרות" style="font-size:13px;padding:8px;text-align:center;height:36px;background:'+(done?"rgba(111,168,107,0.07)":"var(--bg3)")+';border-color:'+(done?"rgba(111,168,107,0.3)":"var(--border2)")+'">';
      h+='<button onclick="checkActiveSet('+ei+','+si+')" style="width:36px;height:36px;border-radius:9px;border:2px solid '+(done?"var(--teal)":"rgba(255,255,255,0.2)")+';background:'+(done?"rgba(111,168,107,0.15)":"transparent")+';color:'+(done?"var(--teal)":"var(--muted2)")+';font-size:16px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center">'+(done?"✓":"○")+'</button>';
      h+='</div>';
    });
    h+='<button onclick="addActiveSet('+ei+')" style="width:100%;margin-top:6px;padding:7px;border-radius:9px;border:1px dashed rgba(255,255,255,0.15);background:transparent;color:var(--muted);font-family:Rubik,sans-serif;font-size:11px;font-weight:700;cursor:pointer">+ הוסף סט</button>';
    h+='</div>';
  });
  document.getElementById("awo-content").innerHTML=h;
}

function updateActiveSet(exIdx,setIdx,field,val){
  if(!activeWorkout)return;
  activeWorkout.exercises[exIdx].sets[setIdx][field]=val;
}

function checkActiveSet(exIdx,setIdx){
  if(!activeWorkout)return;
  const set=activeWorkout.exercises[exIdx].sets[setIdx];
  set.done=!set.done;
  renderActiveWorkout();
  if(set.done) startRestTimer(90);
}

function addActiveSet(exIdx){
  if(!activeWorkout)return;
  const ex=activeWorkout.exercises[exIdx];
  const last=ex.sets[ex.sets.length-1]||{reps:ex.plannedReps,weight:ex.plannedWeight};
  ex.sets.push({reps:last.reps,weight:last.weight,done:false});
  renderActiveWorkout();
}

function startRestTimer(secs){
  clearInterval(_restTimerInterval);
  _restSecondsLeft=secs;
  _restTotalSeconds=secs;
  const bar=document.getElementById("awo-rest-bar");
  if(bar){bar.style.display="flex";}
  _updateRestDisplay();
  _restTimerInterval=setInterval(()=>{
    _restSecondsLeft--;
    _updateRestDisplay();
    if(_restSecondsLeft<=0) skipRest();
  },1000);
}

function _updateRestDisplay(){
  const m=Math.floor(_restSecondsLeft/60);
  const s=(_restSecondsLeft%60).toString().padStart(2,"0");
  const el=document.getElementById("awo-rest-time");
  if(el)el.textContent=m+":"+s;
  const inner=document.getElementById("awo-rest-bar-inner");
  if(inner)inner.style.width=Math.max(0,(_restSecondsLeft/_restTotalSeconds)*100)+"%";
}

function skipRest(){
  clearInterval(_restTimerInterval);
  const bar=document.getElementById("awo-rest-bar");
  if(bar)bar.style.display="none";
}

function confirmFinishWorkout(){
  if(!activeWorkout)return;
  const totalSets=activeWorkout.exercises.reduce((a,ex)=>a+ex.sets.length,0);
  const doneSets=activeWorkout.exercises.reduce((a,ex)=>a+ex.sets.filter(s=>s.done).length,0);
  if(doneSets<totalSets){
    if(!confirm('יש עוד '+(totalSets-doneSets)+' סטים שלא סומנו. לסיים בכל זאת?'))return;
  }
  finishWorkoutConfirm();
}

function finishWorkoutConfirm(){
  if(!activeWorkout)return;
  clearInterval(_workoutTimerInterval);
  skipRest();
  const duration=Math.floor((Date.now()-activeWorkout.startTime)/1000);
  // Save last performed set per exercise to WORKOUT_HIST
  activeWorkout.exercises.forEach(ex=>{
    const k=ex.name.trim().toLowerCase();
    if(!k)return;
    const doneSets=ex.sets.filter(s=>s.done);
    const ref=doneSets.length?doneSets[doneSets.length-1]:ex.sets[ex.sets.length-1];
    if(ref&&(ref.reps||ref.weight)){
      WORKOUT_HIST[k]={sets:ex.sets.filter(s=>s.done).length||ex.sets.length,reps:ref.reps||"",weight:ref.weight||"",date:todayStr()};
    }
  });
  save("workout_hist",WORKOUT_HIST);
  // Mark workout as done in COMP
  const _ck=activeWorkout.idx===0?(todayStr()+"-"+activeWorkout.day):(todayStr()+"-"+activeWorkout.day+"-"+activeWorkout.idx);
  COMP[_ck]=true;
  save("comp",COMP);
  // Save full session to STR_LOG
  const _strEntry={
    id:Date.now(),
    date:todayStr(),
    day:activeWorkout.day,
    duration,
    exercises:activeWorkout.exercises.map(ex=>({
      name:ex.name,
      sets:ex.sets.map(s=>({reps:s.reps,weight:s.weight,done:s.done}))
    }))
  };
  STR_LOG.push(_strEntry);
  save("str_log",STR_LOG);
  const mins=Math.floor(duration/60);
  document.getElementById("active-workout-modal").style.display="none";
  activeWorkout=null;
  toast("🏆 אימון הסתיים! "+mins+" דקות");
  setTimeout(launchConfetti,300);
  renderFitness();
}
function setNewSegType(t){
  _newSegType=t;
  _newSegUnit=(t==="interval"||t==="rest"||t==="hill")?"m":"km";
  document.querySelectorAll('.seg-type-btn').forEach(btn=>{
    const bv=btn.dataset.segtype;
    const sel=bv===t;
    const col=SEG_COLORS[bv]||"#6FA86B";
    btn.style.background=sel?c2r(col,0.18):"var(--bg3)";
    btn.style.color=sel?col:"var(--muted)";
    btn.style.borderColor=sel?col:"var(--border)";
  });
  const uBtn=document.getElementById("ns-unit-btn");
  if(uBtn)uBtn.textContent=_newSegUnit==="km"?'ק"מ':"מ'";
  const repsEl=document.getElementById("ns-reps");
  if(repsEl){
    const cur=parseInt(repsEl.value)||1;
    if((t==="interval"||t==="rest")&&cur===1)repsEl.value="6";
    else if(t!=="interval"&&t!=="rest"&&cur===6)repsEl.value="1";
  }
}
function toggleSegUnit(){
  _newSegUnit=_newSegUnit==="km"?"m":"km";
  const btn=document.getElementById("ns-unit-btn");
  if(btn)btn.textContent=_newSegUnit==="km"?'ק"מ':"מ'";
}
function addRunSegment(){
  normalizePlan();
  const w=USER_PLAN[weDay][weWorkoutIdx];
  if(!w.segments) w.segments=[];
  const reps=parseInt(document.getElementById('ns-reps')?.value)||1;
  const dist=(document.getElementById('ns-dist')?.value||"").trim();
  const pace=(document.getElementById('ns-pace')?.value||"").trim();
  const hr=(document.getElementById('ns-hr')?.value||"").trim();
  if(!dist){toast("נא להזין מרחק");return;}
  w.segments.push({segType:_newSegType,reps,dist,unit:_newSegUnit,pace,hr});
  _newSegType="warmup";_newSegUnit="km";
  renderWorkoutEdit();
}
function removeRunSegment(i){
  normalizePlan();
  const w=USER_PLAN[weDay][weWorkoutIdx];
  if(w&&w.segments) w.segments.splice(i,1);
  renderWorkoutEdit();
}

function buildPs2(){

    h+='<div style="margin-right:auto;width:18px;height:18px;border-radius:50%;border:2px solid '+(sel?"var(--purple)":"var(--border)")+';background:'+(sel?"var(--purple)":"transparent")+'"></div>';

  });
  h+='<div style="font-size:12px;font-weight:700;margin-top:18px;margin-bottom:10px">מה המטרה שלך?</div>';
  [["loss","🔥","ירידה בשומן","גירעון קלורי"],["muscle","💪","בניית שריר","עודף קלורי"],["fitness","⚡","כושר כללי","תחזוקה"]].forEach(([v,ic,l,s])=>{
    const sel=goa===v;
    h+='<div onclick="psData.goal=\''+v+'\';psData.calorieAdjust=null;renderPsStep()" style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1.5px solid '+(sel?"var(--teal)":"var(--border)")+';background:'+(sel?"rgba(111,168,107,0.08)":"var(--card)")+';cursor:pointer;margin-bottom:8px">';
    h+='<span style="font-size:22px">'+ic+'</span>';
    h+='<div><div style="font-size:13px;font-weight:700;color:'+(sel?"var(--teal)":"var(--text)")+'">'+l+'</div><div style="font-size:11px;color:var(--muted)">'+s+'</div></div>';
    h+='<div style="margin-right:auto;width:18px;height:18px;border-radius:50%;border:2px solid '+(sel?"var(--teal)":"var(--border)")+';background:'+(sel?"var(--teal)":"transparent")+'"></div>';
    h+='</div>';
  });
  if(goa!=="fitness"){
    const isLoss=goa==="loss";
    const rgbStr=isLoss?"232,92,74":"111,168,107";
    const colVar=isLoss?"coral":"teal";
    const defaultAdj=isLoss?500:200;
    const adj=psData.calorieAdjust!=null?Math.abs(psData.calorieAdjust):defaultAdj;
    const minV=isLoss?150:100,maxV=isLoss?750:500;
    const pw=Number(psData.weight)||75,ph2=Number(psData.height)||175,pa=Number(psData.age)||25;
    const pbmr=psData.gender==="male"?(10*pw+6.25*ph2-5*pa+5):(10*pw+6.25*ph2-5*pa-161);
    const ptdee=Math.round(pbmr*psData.activityLevel);
    const tgtCal=isLoss?ptdee-adj:ptdee+adj;
    h+='<div style="background:rgba('+rgbStr+',0.07);border:1px solid rgba('+rgbStr+',0.3);border-radius:10px;padding:16px;margin-top:6px">';
    h+='<div style="font-size:12px;font-weight:700;color:var(--'+colVar+');margin-bottom:12px">'+(isLoss?"🔻 גירעון קלורי יומי":"📈 עודף קלורי יומי")+'</div>';

    h+='<span style="font-size:40px;font-weight:900;color:var(--'+colVar+')" id="ps-cal-disp">'+adj+'</span>';
    h+='<span style="font-size:16px;color:var(--'+colVar+')"> קל</span>';
    h+='<div style="font-size:12px;color:var(--muted);margin-top:6px">יעד: <strong style="color:var(--text);font-size:14px" id="ps-cal-tgt">'+tgtCal+'</strong> קל / יום</div>';
    h+='</div>';
    h+='<input type="range" min="'+minV+'" max="'+maxV+'" step="50" value="'+adj+'" oninput="psCalChange(this.value,'+isLoss+','+ptdee+')" style="width:100%;height:6px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,0.12);border-radius:3px;outline:none;cursor:pointer;accent-color:var(--'+colVar+')"/>';
    h+='<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted2);margin-top:6px">';
    h+=(isLoss?'<span>'+minV+' (מינימלי)</span><span style="color:var(--'+colVar+')">⭐ 300–500 מומלץ</span><span>'+maxV+' (אגרסיבי)</span>':'<span>'+minV+' (מינימלי)</span><span style="color:var(--'+colVar+')">⭐ 200–300 מומלץ</span><span>'+maxV+' (גדול)</span>');
    h+='</div></div>';
  }
  h+='<div style="display:flex;gap:10px;margin-top:20px">';
  h+='<button onclick="psStep=1;renderPsStep()" class="btn" style="flex:1;padding:13px;background:var(--bg3);color:var(--muted)">חזור</button>';
  h+='<button onclick="psStep=3;renderPsStep()" class="btn btn-p" style="flex:2;padding:13px;font-size:15px">הבא ←</button>';
  h+='</div>';
  return h;
}

function psCalChange(val,isLoss,tdee){
  val=parseInt(val);
  psData.calorieAdjust=isLoss?-val:val;
  const d=document.getElementById('ps-cal-disp');
  const t=document.getElementById('ps-cal-tgt');
  if(d)d.textContent=val;
  if(t)t.textContent=isLoss?tdee-val:tdee+val;
}

  const p=calcProfile();

function calcProfile(){
  const w=Number(psData.weight)||75;
  const h=Number(psData.height)||175;
  const a=Number(psData.age)||25;
  const bmr=psData.gender==="male"?(10*w+6.25*h-5*a+5):(10*w+6.25*h-5*a-161);
  const tdee=Math.round(bmr*psData.activityLevel);
  let target,protein;
  if(psData.goal==="loss"){const adj=psData.calorieAdjust!=null?psData.calorieAdjust:-500;target=tdee+adj;protein=Math.round(w*2);}
  else if(psData.goal==="muscle"){const adj=psData.calorieAdjust!=null?psData.calorieAdjust:200;target=tdee+adj;protein=Math.round(w*2.2);}
  else{target=tdee;protein=Math.round(w*1.8);}
  const fat=Math.round(target*0.27/9);
  const carbs=Math.round((target-protein*4-fat*9)/4);
  return{...psData,tdee,target,protein,fat,carbs};
}

function psNext1(){
  const name=document.getElementById("ps-name")?.value?.trim();
  const age=document.getElementById("ps-age")?.value;
  const weight=document.getElementById("ps-weight")?.value;
  const height=document.getElementById("ps-height")?.value;
  const err=document.getElementById("ps-err");
  if(!age||!weight||!height){if(err)err.style.display="block";return;}
  psData.name=name;psData.age=Number(age);psData.weight=Number(weight);psData.height=Number(height);
  psStep=2;renderPsStep();
}

function psFinish(){
  const p=calcProfile();
  PROFILE={name:p.name||"",weight:p.weight,tdee:p.tdee,target:p.target,protein:p.protein,carbs:p.carbs,fat:p.fat};
  USER_PLAN={};
  DAYS.forEach(d=>{const t=p.plan[d]||"rest";USER_PLAN[d]=t==="rest"?[]:[{type:t}];});
  save("profile",PROFILE);
  save("user_plan",USER_PLAN);
  if(p.name&&currentUser){
    db.collection("users").doc(currentUser.uid).set({displayName:p.name},{merge:true}).catch(()=>{});
  }
  save("visited",true);
  document.getElementById("profile-setup").style.display="none";
  renderDash();
  toast("ברוך הבא ל-MyWay! 🚀");
}

let obStep=0;

  const s=OB_SLIDES[obStep];
  const isLast=obStep===OB_SLIDES.length-1;
  document.getElementById("ob-icon").textContent=s.icon;
  document.getElementById("ob-title").textContent=s.title;
  document.getElementById("ob-desc").innerHTML=s.desc.replace(/\n/g,"<br>");
  document.getElementById("ob-next").textContent=isLast?"🚀 בוא נתחיל!":"הבא ←";
  document.getElementById("ob-back").style.display=obStep===0?"none":"flex";
  const dots=document.getElementById("ob-dots");
  dots.innerHTML=OB_SLIDES.map((_,i)=>'<div style="width:'+(i===obStep?"22px":"8px")+';height:8px;border-radius:4px;background:'+(i===obStep?"var(--purple)":"rgba(255,255,255,0.15)")+';transition:all 0.3s"></div>').join("");
}
function onboardingNext(){
  if(obStep<OB_SLIDES.length-1){obStep++;renderObStep();}
  else finishOnboarding();
}
function onboardingBack(){
  if(obStep>0){obStep--;renderObStep();}
}
function finishOnboarding(){
  document.getElementById("onboarding").style.display="none";
  showProfileSetup();
}

// ── RIPPLE ──
document.addEventListener('click',function(e){
  const btn=e.target.closest('button');
  if(!btn||btn.style.background==='none'||btn.style.background==='transparent')return;
  btn.classList.add('ripple-host');
  const r=btn.getBoundingClientRect();
  const w=document.createElement('div');
  w.className='rwave';
  w.style.left=(e.clientX-r.left)+'px';
  w.style.top=(e.clientY-r.top)+'px';
  btn.appendChild(w);
  w.addEventListener('animationend',()=>w.remove());
},{passive:true});

// ── CONFETTI ──
function launchConfetti(){
  const cols=['#FF7A45','#6FA86B','#E8B54A','#E85C4A','#6B8FA3','#D98878','#A29BFE'];
  for(let i=0;i<70;i++){
    const el=document.createElement('div');
    const size=5+Math.random()*8;
    const delay=Math.random()*0.6;
    const dur=1.4+Math.random()*1.2;
    el.style.cssText=`position:fixed;top:-10px;left:${10+Math.random()*80}vw;width:${size}px;height:${size}px;background:${cols[Math.floor(Math.random()*cols.length)]};border-radius:${Math.random()>.4?'50%':'3px'};pointer-events:none;z-index:9999;animation:confettiFall ${dur}s ease ${delay}s forwards`;
    document.body.appendChild(el);
    el.addEventListener('animationend',()=>el.remove());
  }
}

// ── COUNT-UP ──
function animCount(el,target,dur=900){
  if(!el)return;
  const start=Date.now();
  const from=parseInt(el.textContent)||0;
  (function tick(){
    const p=Math.min((Date.now()-start)/dur,1);
    const ease=1-Math.pow(1-p,3);
    el.textContent=Math.round(from+(target-from)*ease);
    if(p<1)requestAnimationFrame(tick);
  })();
}
