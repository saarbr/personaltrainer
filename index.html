<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MyWay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080B14;--bg2:#0E1220;--bg3:#141828;--card:#111520;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --text:#F0F2FF;--muted:rgba(240,242,255,0.4);--muted2:rgba(240,242,255,0.2);
  --purple:#8B7FFF;--purple-g:linear-gradient(135deg,#8B7FFF,#6C5CE7);
  --teal:#00D4A1;--amber:#FFB347;--coral:#FF6B6B;--pink:#FF79C6;--blue:#74B9FF;
  --nav-h:68px;
}
body.light{
  --bg:#F2F4FF;--bg2:#E8EBFA;--bg3:#DEE2F5;--card:#FFFFFF;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.15);
  --text:#1A1D2E;--muted:rgba(26,29,46,0.45);--muted2:rgba(26,29,46,0.22);
}
body.light .header{background:rgba(242,244,255,0.9);border-bottom-color:rgba(139,127,255,0.2);}
body.light .nav{background:rgba(242,244,255,0.96);border-top-color:rgba(0,0,0,0.08);}
body.light .logo-text{background:linear-gradient(120deg,#1A1D2E 40%,rgba(139,127,255,0.9));-webkit-background-clip:text;background-clip:text;}
body.light .card{box-shadow:0 1px 8px rgba(0,0,0,0.06);}
body.light .inp{background:#fff;border-color:rgba(0,0,0,0.15);color:var(--text);}
body.light #signin-screen{background:var(--bg);}
body{background:var(--bg);color:var(--text);font-family:'Rubik',sans-serif;direction:rtl;
  min-height:100vh;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-top:env(safe-area-inset-top);overflow-x:hidden;}
.header{position:sticky;top:0;z-index:200;
  background:rgba(8,11,20,0.82);backdrop-filter:blur(28px);
  border-bottom:1px solid rgba(139,127,255,0.18);
  padding:13px 18px;display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 2px 24px rgba(139,127,255,0.08);}
.logo-icon{width:40px;height:40px;border-radius:13px;background:var(--purple-g);
  display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;
  box-shadow:0 0 22px rgba(139,127,255,0.55),0 2px 8px rgba(0,0,0,0.3);}
.logo-text{font-size:26px;font-weight:900;letter-spacing:-0.5px;
  background:linear-gradient(120deg,#fff 40%,rgba(139,127,255,0.85));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.logo-sub{font-size:10px;color:var(--muted);letter-spacing:0.2px;margin-top:1px}
.nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);
  padding-bottom:env(safe-area-inset-bottom);background:rgba(8,11,20,0.92);
  backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;z-index:200;}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;border:none;background:transparent;color:var(--muted);cursor:pointer;
  font-family:'Rubik',sans-serif;font-size:10px;font-weight:500;transition:all 0.2s;position:relative;}
.nb.active{color:var(--purple)}
.nb.active::after{content:'';position:absolute;top:0;left:20%;right:20%;height:2px;
  background:var(--purple-g);border-radius:0 0 4px 4px;box-shadow:0 0 8px rgba(139,127,255,0.6);}
.ni{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;transition:transform 0.2s;}
.nb.active .ni{transform:scale(1.1)}
.page{display:none;padding:14px 16px 8px;animation:fadeIn 0.2s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.subtabs{display:flex;gap:5px;margin-bottom:12px;background:var(--card);
  border-radius:13px;padding:4px;border:1px solid var(--border);}
.stb{flex:1;padding:8px 5px;border-radius:9px;border:none;cursor:pointer;
  font-family:'Rubik',sans-serif;font-size:11px;font-weight:700;
  background:transparent;color:var(--muted);transition:all 0.2s;}
.stb.on{color:#fff}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:11px;}
.fi{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:5px;}
.fv{font-size:28px;font-weight:900;letter-spacing:-0.5px;line-height:1;}
.fu{font-size:10px;color:var(--muted);margin-top:2px;}
.inp{width:100%;padding:10px 13px;border-radius:11px;border:1px solid var(--border2);
  background:var(--bg3);color:var(--text);font-family:'Rubik',sans-serif;font-size:13px;
  outline:none;direction:rtl;transition:border-color 0.2s;}
.inp:focus{border-color:var(--purple)}
.btn{padding:11px;border-radius:11px;border:none;cursor:pointer;
  font-family:'Rubik',sans-serif;font-size:13px;font-weight:800;transition:all 0.2s;}
.btn-p{background:var(--purple-g);color:#fff;box-shadow:0 3px 14px rgba(139,127,255,0.35);}
.btn-p:active{transform:scale(0.98)}
.empty{text-align:center;padding:50px 20px;color:var(--muted);}
.ei{font-size:44px;margin-bottom:10px;}
.et{font-size:13px;font-weight:500;}
.es{font-size:11px;margin-top:4px;opacity:0.7;}
.toast{position:fixed;bottom:calc(var(--nav-h)+14px);left:50%;
  transform:translateX(-50%) translateY(8px);
  background:rgba(0,212,161,0.15);backdrop-filter:blur(10px);
  border:1px solid rgba(0,212,161,0.3);color:var(--teal);
  padding:9px 20px;border-radius:28px;font-size:13px;font-weight:700;
  z-index:999;opacity:0;transition:all 0.3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* QC button */
#qcbtn{position:fixed;bottom:calc(var(--nav-h)+14px);left:16px;
  width:48px;height:48px;border-radius:50%;border:none;cursor:pointer;
  background:var(--purple-g);color:#fff;font-size:22px;
  box-shadow:0 4px 16px rgba(139,127,255,0.5);z-index:250;
  display:flex;align-items:center;justify-content:center;}
#qcmod{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);
  z-index:500;align-items:flex-end;justify-content:center;}
#qcmod.open{display:flex;}
.qcbox{background:#12122A;border-radius:20px 20px 0 0;padding:20px;
  width:100%;max-width:600px;border-top:1px solid rgba(139,127,255,0.3);}
</style>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>
<script>if(localStorage.getItem('theme')==='light')document.body.classList.add('light');</script>
<div id="signin-screen" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:2000;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;overflow-y:auto">
  <div style="font-size:64px;margin-bottom:20px;filter:drop-shadow(0 0 20px rgba(139,127,255,0.5))">🏃</div>
  <div style="font-size:36px;font-weight:900;letter-spacing:-1px;background:linear-gradient(120deg,#fff 40%,rgba(139,127,255,0.85));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px">MyWay</div>
  <div style="font-size:14px;color:var(--muted);margin-bottom:32px">האפליקציה האישית שלך</div>
  <button onclick="signInWithGoogle()" style="display:flex;align-items:center;gap:12px;padding:14px 24px;border-radius:14px;border:1px solid var(--border2);background:var(--card);color:var(--text);font-family:Rubik,sans-serif;font-size:15px;font-weight:700;cursor:pointer;width:100%;max-width:320px;justify-content:center">
    <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20H24v8h11.3C33.6 33.1 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.7 1.1 7.8 2.9l5.7-5.7C34.1 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 19.7-8 19.7-20 0-1.3-.1-2.7-.1-4z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 15.1 18.9 12 24 12c3 0 5.7 1.1 7.8 2.9l5.7-5.7C34.1 6.5 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.9 13.5-5.1l-6.2-5.2C29.4 35.5 26.8 36 24 36c-5.2 0-9.6-2.9-11.3-7.1l-6.6 4.8C9.7 39.7 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20H24v8h11.3c-.9 2.4-2.5 4.4-4.6 5.8l6.2 5.2C40.6 35.5 44 30.2 44 24c0-1.3-.1-2.7-.4-4z"/></svg>
    המשך עם Google
  </button>
  <div style="display:flex;align-items:center;gap:10px;width:100%;max-width:320px;margin:20px 0">
    <div style="flex:1;height:1px;background:var(--border2)"></div>
    <div style="font-size:12px;color:var(--muted)">או</div>
    <div style="flex:1;height:1px;background:var(--border2)"></div>
  </div>
  <div style="display:flex;gap:4px;width:100%;max-width:320px;background:var(--card);border-radius:11px;padding:4px;border:1px solid var(--border);margin-bottom:14px">
    <button id="si-tab-login" onclick="setAuthMode('login')" style="flex:1;padding:8px;border-radius:8px;border:none;background:var(--purple-g);color:#fff;font-family:Rubik,sans-serif;font-size:13px;font-weight:700;cursor:pointer">כניסה</button>
    <button id="si-tab-register" onclick="setAuthMode('register')" style="flex:1;padding:8px;border-radius:8px;border:none;background:transparent;color:var(--muted);font-family:Rubik,sans-serif;font-size:13px;font-weight:700;cursor:pointer">הרשמה</button>
  </div>
  <div style="width:100%;max-width:320px;display:flex;flex-direction:column;gap:9px">
    <input id="si-email" type="email" placeholder="אימייל" class="inp" style="text-align:right;direction:rtl"/>
    <input id="si-pass" type="password" placeholder="סיסמה (לפחות 6 תווים)" class="inp" style="text-align:right;direction:rtl" onkeydown="if(event.key==='Enter')submitAuth()"/>
    <input id="si-pass2" type="password" placeholder="אימות סיסמה" class="inp" style="text-align:right;direction:rtl;display:none" onkeydown="if(event.key==='Enter')submitAuth()"/>
    <div id="auth-err" style="display:none;color:#FF6B6B;font-size:12px;font-weight:600;text-align:center"></div>
    <button onclick="submitAuth()" class="btn btn-p" id="si-submit" style="width:100%;padding:13px;font-size:14px">כניסה</button>
  </div>
</div>

<div id="loading-screen" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:1900;flex-direction:column;align-items:center;justify-content:center">
  <video autoplay loop muted playsinline style="width:200px;height:200px;object-fit:contain">
    <source src="logo.mp4" type="video/mp4">
  </video>
</div>

<button id="qcbtn" onclick="openQC()">+</button>
<div id="qcmod">
  <div class="qcbox">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div style="font-size:16px;font-weight:800">⚡ הוסף מהיר</div>
      <button onclick="closeQC()" style="background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer">✕</button>
    </div>
    <div style="display:flex;gap:6px;margin-bottom:12px">
      <button onclick="setQT('today')" id="qt-today" class="btn" style="flex:1;padding:8px;font-size:11px;background:var(--purple);color:#fff">📋 היום</button>
      <button onclick="setQT('tomorrow')" id="qt-tomorrow" class="btn" style="flex:1;padding:8px;font-size:11px;background:var(--bg3);color:var(--muted)">📋 מחר</button>
      <button onclick="setQT('note')" id="qt-note" class="btn" style="flex:1;padding:8px;font-size:11px;background:var(--bg3);color:var(--muted)">📝 הערה</button>
    </div>
    <textarea id="qcinp" placeholder="מה יש לך בראש?" style="width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--border2);background:var(--bg3);color:var(--text);font-family:'Rubik',sans-serif;font-size:14px;outline:none;direction:rtl;resize:none;height:75px;margin-bottom:11px"></textarea>

  </div>
</div>

function load(k,d){try{const v=localStorage.getItem("tr_"+k);return v?JSON.parse(v):d;}catch(e){return d;}}
function save(k,v){
  try{localStorage.setItem("tr_"+k,JSON.stringify(v));}catch(e){}
  if(currentUser){
    db.collection("users").doc(currentUser.uid).set({[k]:v},{merge:true}).catch(e=>console.error("save error:",e));
  }
}
async function loadFromFirestore(uid){
  try{
    const snap=await db.collection("users").doc(uid).get();
    if(!snap.exists)return true; // brand new user
    const d=snap.data();
    ["runs","comp","nut","burns","goals","tasks","habit_log","quick_notes","journals","habits_def","visited","profile","user_plan"].forEach(k=>{
      if(d[k]!==undefined)try{localStorage.setItem("tr_"+k,JSON.stringify(d[k]));}catch(e){}
    });
    RUNS=load("runs",[]);COMP=load("comp",{});NUT=load("nut",{});
    BURNS=load("burns",{});GOALS=load("goals",{});TASKS=load("tasks",{});
    HABIT_LOG=load("habit_log",{});NOTES=load("quick_notes",[]);
    JOURNALS=load("journals",{});HABITS_DEF=load("habits_def",[]);
    WORKOUT_HIST=load("workout_hist",{});
    PROFILE=load("profile",PROFILE);USER_PLAN=load("user_plan",null);
    if(d.displayName&&!PROFILE.name){PROFILE.name=d.displayName;save("profile",PROFILE);}
    return !d.profile && !d.visited; // show onboarding only if neither profile nor visited flag exists
  }catch(e){console.error("load error:",e);return true;}
}

function showAuthError(msg){
  const el=document.getElementById('auth-err');

function hideAuthError(){
  const el=document.getElementById('auth-err');

function getAuthError(e){
  const map={
    'auth/email-already-in-use':'כתובת האימייל כבר קיימת',
    'auth/invalid-email':'כתובת אימייל לא תקינה',
    'auth/weak-password':'הסיסמה קצרה מדי (לפחות 6 תווים)',
    'auth/user-not-found':'משתמש לא נמצא',
    'auth/wrong-password':'סיסמה שגויה',
    'auth/invalid-credential':'אימייל או סיסמה שגויים',
    'auth/too-many-requests':'יותר מדי ניסיונות. נסה שוב מאוחר יותר',
  };
  return map[e.code]||e.message;
}
function submitAuth(){
  hideAuthError();
  const email=document.getElementById('si-email').value.trim();
  const pass=document.getElementById('si-pass').value;
  if(!email||!pass){showAuthError('נא למלא אימייל וסיסמה');return;}
  if(_authMode==='register'){
    const pass2=document.getElementById('si-pass2').value;
    if(pass!==pass2){showAuthError('הסיסמאות לא תואמות');return;}
    if(pass.length<6){showAuthError('הסיסמה קצרה מדי (לפחות 6 תווים)');return;}
    auth.createUserWithEmailAndPassword(email,pass).catch(e=>showAuthError(getAuthError(e)));
  } else {
    auth.signInWithEmailAndPassword(email,pass).catch(e=>showAuthError(getAuthError(e)));
  }
}
function showGoogleAuthError(e){
  if(!e)return;
  if(e.code==='auth/popup-closed-by-user'||e.code==='auth/cancelled-popup-request')return;
  const errEl=document.getElementById("auth-err");
  if(!errEl)return;
  const msgs={
    'auth/unauthorized-domain':'הדומיין לא מורשה ב-Firebase — הוסף אותו ב-Firebase Console → Authentication → Authorized domains',
    'auth/popup-blocked':'הפופאפ נחסם, נסה לאפשר פופאפים בדפדפן',
    'auth/network-request-failed':'בעיית תקשורת, בדוק חיבור לאינטרנט',
    'auth/internal-error':'שגיאה פנימית, נסה שוב מאוחר יותר',
    'auth/operation-not-allowed':'כניסה עם Google אינה מופעלת ב-Firebase',
  };
  errEl.textContent=msgs[e.code]||(e.message||'שגיאת כניסה עם Google');
  errEl.style.display="block";
  console.error("google auth error:",e.code,e.message);
}
function signInWithGoogle(){
  const errEl=document.getElementById("auth-err");
  if(errEl)errEl.style.display="none";
  const provider=new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({prompt:'select_account'});
  auth.signInWithPopup(provider).catch(e=>{
    if(e.code==='auth/popup-blocked'){
      auth.signInWithRedirect(provider).catch(showGoogleAuthError);
    } else {
      showGoogleAuthError(e);
    }
  });
}

async function submitEmailAuth(){
  const email=document.getElementById("auth-email")?.value?.trim();

    if(pass!==confirm){if(errEl){errEl.textContent="הסיסמאות אינן תואמות";errEl.style.display="block";}return;}
  }
  const btn=document.getElementById("auth-submit");
  if(btn){btn.textContent="...";btn.disabled=true;}
  try{
    if(authMode==='login'){
      await auth.signInWithEmailAndPassword(email,pass);
    } else {
      await auth.createUserWithEmailAndPassword(email,pass);
    }
  }catch(e){
    const msgs={
      'auth/user-not-found':'משתמש לא נמצא',
      'auth/wrong-password':'סיסמה שגויה',
      'auth/invalid-credential':'אימייל או סיסמה שגויים',
      'auth/email-already-in-use':'אימייל כבר רשום, נסה להתחבר',
      'auth/invalid-email':'אימייל לא תקין',
      'auth/weak-password':'הסיסמה חלשה מדי (לפחות 6 תווים)',
      'auth/too-many-requests':'יותר מדי נסיונות, נסה מאוחר יותר',
      'auth/network-request-failed':'בעיית תקשורת, בדוק חיבור לאינטרנט',
    };
    if(errEl){errEl.textContent=msgs[e.code]||e.message;errEl.style.display="block";}
  }
  if(btn){btn.textContent=authMode==='login'?"כניסה":"הרשמה";btn.disabled=false;}
}

function calcStreak(){
  let s=0;const d=new Date();
  for(let i=0;i<365;i++){
    const ds=new Date(d);ds.setDate(ds.getDate()-i);
    const dstr=ds.toISOString().slice(0,10);
    const hl=HABIT_LOG[dstr]||{};
    const tl=TASKS[dstr]||[];
    if(HABITS_DEF.filter(h=>hl[h.id]).length===0&&tl.filter(t=>t.done).length===0)break;
    s++;
  }
  return s;
}

function toggleTask(date,idx){
  if(!TASKS[date])return;
  TASKS[date][idx].done=!TASKS[date][idx].done;
  save("tasks",TASKS);renderDash();
}
function addTask(date,inputId){
  const inp=document.getElementById(inputId);
  if(!inp||!inp.value.trim())return;
  if(!TASKS[date])TASKS[date]=[];
  TASKS[date].push({id:Date.now(),text:inp.value.trim(),done:false});
  save("tasks",TASKS);inp.value="";renderDash();
}
function delTask(date,idx){
  if(TASKS[date])TASKS[date].splice(idx,1);
  save("tasks",TASKS);renderDash();
}
function toggleHabit(id,date){
  if(!HABIT_LOG[date])HABIT_LOG[date]={};
  HABIT_LOG[date][id]=!HABIT_LOG[date][id];
  save("habit_log",HABIT_LOG);renderDash();
}

function handleImgUpload(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const src=e.target.result;
    const img=new Image();
    img.onload=()=>{
      const cv=document.createElement("canvas");
      cv.width=img.naturalWidth;cv.height=img.naturalHeight;
      const ctx=cv.getContext("2d");
      ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);
      ctx.drawImage(img,0,0);
      const jpeg=cv.toDataURL("image/jpeg",0.85);
      imgB64=jpeg.split(",")[1];
      const p=document.getElementById("img-preview");
      if(p){p.src=jpeg;p.style.display="block";}
      const b=document.getElementById("analyze-btn");
      if(b)b.style.display="block";
    };
    img.src=src;
  };
  reader.readAsDataURL(file);
}

async function analyzeGarminImg(){
  if(!imgB64)return;
  const btn=document.getElementById("analyze-btn");
  const status=document.getElementById("analyze-status");
  if(btn){btn.textContent="🔍 מנתח...";btn.disabled=true;}
  try{
    const token=currentUser?await currentUser.getIdToken():"";
    const resp=await fetch("/.netlify/functions/analyze",{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},
      body:JSON.stringify({image:imgB64,mediaType:"image/jpeg"})
    });
    if(!resp.ok){const t=await resp.text();throw new Error("HTTP "+resp.status+": "+t.slice(0,100));}
    const result=await resp.json();
    if(result.error)throw new Error(result.error);
    if(result.km)document.getElementById("akm").value=result.km;
    if(result.pace)document.getElementById("apace").value=result.pace;
    if(result.avgHr)document.getElementById("ahr").value=result.avgHr;
    if(result.date)document.getElementById("adate").value=result.date;
    if(status)status.innerHTML='<div style="background:rgba(0,212,161,0.1);border:1px solid rgba(0,212,161,0.3);border-radius:9px;padding:9px 12px;font-size:12px;color:#00D4A1">✓ זוהה: '+esc(result.km)+' ק"מ · קצב '+esc(result.pace)+' · דופק '+esc(result.avgHr||"—")+'</div>';
  }catch(e){
    if(status)status.innerHTML='<div style="background:rgba(255,107,107,0.1);border:1px solid rgba(255,107,107,0.3);border-radius:9px;padding:9px 12px;font-size:11px;color:#FF6B6B">שגיאה: '+esc(e.message)+'</div>';
  }
  if(btn){btn.textContent="🔍 נתח שוב";btn.disabled=false;}
}

function delRun(id){
  if(!confirm('למחוק?'))return;
  RUNS=RUNS.filter(r=>r.id!==id);
  save('runs',RUNS);renderFitness();
}

function submitRun(){
  const km=document.getElementById("akm")?.value;
  const pace=document.getElementById("apace")?.value;
  const err=document.getElementById("aerr");
  if(!km||!pace){if(err)err.style.display="block";return;}
  RUNS.unshift({
    id:Date.now(),
    date:document.getElementById("adate")?.value||todayStr(),
    week:Number(document.getElementById("aweek")?.value)||1,
    type:addType,km:parseFloat(km),paceSec:parsePace(pace),
    avgHr:document.getElementById("ahr")?.value?Number(document.getElementById("ahr").value):null,
    effort:document.getElementById("aeff")?.value||"בינוני",
    notes:document.getElementById("anotes")?.value||""
  });
  save("runs",RUNS);toast("✓ ריצה נשמרה! 🎉");
  fitTab="history";renderFitness();
}

async function analyzeFood(){
  const input = document.getElementById('ai-food-input');
  const btn = document.getElementById('ai-food-btn');
  const result = document.getElementById('ai-food-result');
  const errDiv = document.getElementById('ai-food-err');
  const text = input?.value?.trim();

  if(!text){
    if(errDiv){ errDiv.textContent='נא לכתוב מה אכלת'; errDiv.style.display='block'; }
    return;
  }

  if(errDiv) errDiv.style.display='none';
  if(result){ result.style.display='block'; result.innerHTML='<div style="font-size:12px;color:var(--muted)">ה-AI מחשב ערכים תזונתיים...</div>'; }
  if(btn){ btn.textContent='⏳ מנתח...'; btn.disabled=true; }

  try {
    const token=currentUser?await currentUser.getIdToken():"";
    const resp = await fetch('/.netlify/functions/analyze', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token},
      body: JSON.stringify({ type: 'food', text: text })
    });
    if(!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    if(data.error) throw new Error(data.error);

    const d = data;
    window._pendingFood = d;
    result.innerHTML =
      '<div style="background:rgba(0,212,161,0.08);border:1px solid rgba(0,212,161,0.25);border-radius:12px;padding:13px;margin-bottom:9px">' +
      '<div style="font-size:13px;font-weight:700;color:var(--teal);margin-bottom:8px">✓ ' + esc(d.desc) + '</div>' +
      '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px">' +
      '<div style="background:var(--bg3);border-radius:9px;padding:9px;text-align:center"><div style="font-size:9px;color:var(--muted);margin-bottom:2px">קלוריות</div><div style="font-size:18px;font-weight:800;color:var(--coral)">' + esc(d.cal) + '</div></div>' +
      '<div style="background:var(--bg3);border-radius:9px;padding:9px;text-align:center"><div style="font-size:9px;color:var(--muted);margin-bottom:2px">חלבון</div><div style="font-size:18px;font-weight:800;color:var(--purple)">' + esc(d.p) + 'g</div></div>' +
      '<div style="background:var(--bg3);border-radius:9px;padding:9px;text-align:center"><div style="font-size:9px;color:var(--muted);margin-bottom:2px">פחמימות</div><div style="font-size:18px;font-weight:800;color:var(--teal)">' + esc(d.c) + 'g</div></div>' +
      '<div style="background:var(--bg3);border-radius:9px;padding:9px;text-align:center"><div style="font-size:9px;color:var(--muted);margin-bottom:2px">שומן</div><div style="font-size:18px;font-weight:800;color:var(--amber)">' + esc(d.f) + 'g</div></div>' +
      '</div>' +
      (d.notes ? '<div style="font-size:11px;color:var(--muted);margin-bottom:10px;line-height:1.5">📝 ' + esc(d.notes) + '</div>' : '') +
      '<button onclick="confirmAddFood()" class="btn btn-p" style="width:100%;font-size:13px">✓ הוסף ליומן</button>' +
      '</div>';

    input.value = '';
  } catch(e) {
    if(result) result.style.display='none';
    if(errDiv){ errDiv.textContent='שגיאה: ' + e.message; errDiv.style.display='block'; }
  }
  if(btn){ btn.textContent='🔍 נתח עם AI'; btn.disabled=false; }
}

function confirmAddFood(){
  const d = window._pendingFood;
  if(!d) return;
  addFoodFromAI(d.cal, d.p, d.c, d.f, d.desc);
  window._pendingFood = null;
}

function addFoodFromAI(cal, p, c, f, desc){
  if(!NUT[selDate]) NUT[selDate] = [];
  NUT[selDate].push({
    id: Date.now(), desc, cal, p, c, f,
    time: new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})
  });
  save('nut', NUT);
  toast('✓ ' + desc + ' נוסף ליומן! 🍽️');
  renderNut();
}

function goToTodayWorkout(){fitTab="plan";goTo("fitness");setTimeout(()=>{const el=document.getElementById("fitness-today-col");if(el)el.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});},150);}

function setSelectedDay(day){selectedDay=day;renderFitness();}

function addWorkoutToDay(day){
  normalizePlan();

  save("user_plan",USER_PLAN);

function removeWorkoutFromDay(day,idx){

}

  renderFitness();
}

  DAYS.forEach(day=>{

    h+='<div style="height:1px;background:var(--border);margin-bottom:8px"></div>';

      h+='<div style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 0;color:var(--muted)">';
      h+='<span style="font-size:22px">😴</span>';
      h+='<span style="font-size:10px">מנוחה</span>';
      h+='</div>';

        const color=w.type==="strength"?"#8B7FFF":"#00D4A1";

          } else {
            exs.forEach(ex=>{

              h+='</div>';
            });
          }

          const segs=w.segments||[];
          if(!segs.length){
            let basic=[];
            if(w.distance)basic.push(w.distance+' ק"מ');
            if(w.pace)basic.push(w.pace+'/ק"מ');
            h+='<div style="font-size:10px;color:var(--muted);font-style:italic">'+(basic.length?basic.join(' · '):'אין מקטעים')+'</div>';
          } else {
            const totalKm=segs.reduce((a,sg)=>{const d=parseFloat(sg.dist)||0;return a+(sg.unit==="m"?d/1000:d)*(sg.reps||1);},0);
            segs.forEach(seg=>{
              const si=SEG_LABELS[seg.segType]||{ic:"🏃",l:"מקטע"};
              const col=SEG_COLORS[seg.segType]||"#00D4A1";
              const distLbl=seg.unit==="m"?seg.dist+"מ'":(seg.dist+'ק"מ');
              h+='<div style="padding:4px 6px;border-radius:6px;background:'+c2r(col,0.07)+';border:1px solid '+c2r(col,0.18)+';margin-bottom:3px">';
              h+='<div style="display:flex;align-items:center;gap:4px">';
              h+='<span style="font-size:11px">'+si.ic+'</span>';
              h+='<span style="font-size:10px;font-weight:700;color:'+col+'">'+si.l+(seg.reps>1?' ×'+seg.reps:'')+'</span>';
              h+='<span style="font-size:9px;color:var(--muted);margin-right:auto">'+distLbl+'</span>';
              h+='</div>';
              if(seg.pace||seg.hr)h+='<div style="font-size:9px;color:var(--muted2);margin-top:1px;padding-right:2px">'+(seg.pace?'🏃 '+seg.pace:'')+(seg.pace&&seg.hr?' · ':'')+(seg.hr?'♥ '+seg.hr:'')+'</div>';
              h+='</div>';
            });
            if(totalKm>0)h+='<div style="font-size:9px;color:var(--teal);font-weight:700;margin-top:3px">סה"כ ~'+totalKm.toFixed(1)+' ק"מ</div>';
          }
        }
      });
    }

    h+='</div>';
  });

  h+='</div></div>';
  return h;
}

function renderNut(){
  const el=document.getElementById("pg-nutrition");
  const todayE=NUT[selDate]||[];
  const burnT=BURNS[selDate]||0;
  const tot=todayE.reduce((a,e)=>({cal:a.cal+e.cal,p:a.p+e.p,c:a.c+e.c,f:a.f+e.f}),{cal:0,p:0,c:0,f:0});
  const netCal=tot.cal-burnT;
  const def=PROFILE.tdee-netCal;
  const defOk=def>=300&&def<=600,defBig=def>600;

function setBurn(){
  const cv=document.getElementById("cburn")?.value;
  const val=cv?Number(cv):(BURN_P.find(([t])=>t===dayType)?.[1]||0);
  BURNS[selDate]=val;save("burns",BURNS);toast("✓ שריפה עודכנה");renderNut();
}
function addNut(){
  const desc=document.getElementById("nd")?.value;
  const cal=document.getElementById("nc")?.value;
  const err=document.getElementById("nerr");
  if(!desc||!cal){if(err)err.style.display="block";return;}
  if(!NUT[selDate])NUT[selDate]=[];
  NUT[selDate].push({id:Date.now(),desc,time:document.getElementById("nt")?.value||"",
    cal:Number(cal),p:Number(document.getElementById("np")?.value)||0,
    c:Number(document.getElementById("ncarb")?.value)||0,
    f:Number(document.getElementById("nf")?.value)||0});
  save("nut",NUT);toast("✓ ארוחה נשמרה! 🍽️");renderNut();
}
function delNut(idx){NUT[selDate].splice(idx,1);save("nut",NUT);renderNut();}
function quickLogFood(idx){
  const q=QUICK_FOODS[idx];if(!q)return;
  if(!NUT[selDate])NUT[selDate]=[];
  const now=new Date();
  const time=now.getHours().toString().padStart(2,"0")+":"+now.getMinutes().toString().padStart(2,"0");
  NUT[selDate].push({id:Date.now(),desc:q.e+" "+q.l,cal:q.cal,p:q.p,c:q.c,f:q.f,time});
  save("nut",NUT);toast("✓ "+q.l+" נוסף!");renderNut();
}
function quickAddProtein(g){
  if(!NUT[selDate])NUT[selDate]=[];
  const now=new Date();
  const time=now.getHours().toString().padStart(2,"0")+":"+now.getMinutes().toString().padStart(2,"0");
  NUT[selDate].push({id:Date.now(),desc:"💊 "+g+"g חלבון",cal:g*4,p:g,c:0,f:0,time});
  save("nut",NUT);toast("✓ +"+g+"g חלבון נוסף!");renderNut();
}
function nutChangeDay(delta){
  const d=new Date(selDate+'T12:00:00');
  d.setDate(d.getDate()+delta);
  const next=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  if(next<=todayStr()){selDate=next;renderNut();}
}

  const streak=calcStreak();

// Goals actions
function setGoal(catId,date,val){if(!GOALS[date])GOALS[date]={};if(!GOALS[date][catId])GOALS[date][catId]={};GOALS[date][catId].goal=val.trim();save("goals",GOALS);}
function toggleDone(catId,date){if(!GOALS[date])GOALS[date]={};if(!GOALS[date][catId])GOALS[date][catId]={};GOALS[date][catId].done=!GOALS[date][catId].done;save("goals",GOALS);toast(GOALS[date][catId].done?"✓ יעד הושלם! 🎉":"");renderProductivity();}
function setScore(catId,date,n){if(!GOALS[date])GOALS[date]={};if(!GOALS[date][catId])GOALS[date][catId]={};GOALS[date][catId].score=GOALS[date][catId].score===n?null:n;save("goals",GOALS);renderProductivity();}
function setReflection(catId,date,val){if(!GOALS[date])GOALS[date]={};if(!GOALS[date][catId])GOALS[date][catId]={};GOALS[date][catId].reflection=val;save("goals",GOALS);}
function saveNewGoals(tStr){save("goals",GOALS);toast("✓ יעדים נשמרו! 🎯");goalsView="today";goalDate=tStr;renderProductivity();}
// Journal actions
function saveJField(date,field,val){if(!JOURNALS[date])JOURNALS[date]={};JOURNALS[date][field]=typeof val==="number"?val:val.trim();save("journals",JOURNALS);}
function markMDone(date){if(!JOURNALS[date])JOURNALS[date]={};JOURNALS[date].morningDone=!JOURNALS[date].morningDone;save("journals",JOURNALS);toast(JOURNALS[date].morningDone?"☀️ בוקר טוב!":"");renderProductivity();}
function markEDone(date){if(!JOURNALS[date])JOURNALS[date]={};JOURNALS[date].eveningDone=!JOURNALS[date].eveningDone;save("journals",JOURNALS);toast(JOURNALS[date].eveningDone?"🌙 לילה טוב!":"");renderProductivity();}
// Notes
function delNote(idx){NOTES.splice(idx,1);save("quick_notes",NOTES);renderProductivity();}

function openQC(){document.getElementById("qcmod").classList.add("open");setTimeout(()=>document.getElementById("qcinp")?.focus(),100);}
function closeQC(){document.getElementById("qcmod").classList.remove("open");const i=document.getElementById("qcinp");if(i)i.value="";}
function setQT(type){
  qcType=type;
  ["today","tomorrow","note"].forEach(t=>{
    const b=document.getElementById("qt-"+t);
    if(b){b.style.background=t===type?"var(--purple)":"var(--bg3)";b.style.color=t===type?"#fff":"var(--muted)";}
  });
}
function saveQC(){
  const val=document.getElementById("qcinp")?.value?.trim();
  if(!val)return;
  if(qcType==="today"||qcType==="tomorrow"){
    const d=qcType==="today"?todayStr():(()=>{const t=new Date();t.setDate(t.getDate()+1);return t.toISOString().slice(0,10);})();
    if(!TASKS[d])TASKS[d]=[];
    TASKS[d].push({id:Date.now(),text:val,done:false});
    save("tasks",TASKS);toast("✓ נוסף ל"+(qcType==="today"?"היום":"מחר")+"!");
  } else {
    NOTES.unshift({id:Date.now(),text:val,date:todayStr(),time:new Date().toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"})});
    save("quick_notes",NOTES);toast("✓ הערה נשמרה!");
  }
  closeQC();
  if(currentPg==="dash")renderDash();
  else if(currentPg==="productivity")renderProductivity();
}
document.getElementById("qcmod").addEventListener("click",function(e){if(e.target===this)closeQC();});
document.addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key==="k"){e.preventDefault();openQC();}});

// WORKOUT EDITOR
// ═══════════════════════════════════════════════
function getDayWorkouts(day){
  if(!USER_PLAN) return [];
  const d=USER_PLAN[day];
  if(!d) return [];
  if(Array.isArray(d)) return d;
  if(typeof d==="string") return d==="rest"?[]:[{type:d}];
  return d.type==="rest"?[]:[d];
}
function getDayPlan(day){
  return getDayWorkouts(day)[0]||{type:"rest"};
}
function getWorkout(day,idx){
  return getDayWorkouts(day)[idx]||{type:"rest"};
}
function normalizePlan(){
  if(!USER_PLAN) return;
  DAYS.forEach(d=>{
    if(!USER_PLAN[d]||USER_PLAN[d]==="rest"){USER_PLAN[d]=[];}
    else if(typeof USER_PLAN[d]==="string"){USER_PLAN[d]=[{type:USER_PLAN[d]}];}
    else if(!Array.isArray(USER_PLAN[d])){USER_PLAN[d]=USER_PLAN[d].type==="rest"?[]:[USER_PLAN[d]];}
  });
}

let weDay=null;
function openWorkoutEdit(day,workoutIdx){
  normalizePlan();
  weDay=day;
  weWorkoutIdx=workoutIdx||0;
  _newSegType="warmup";
  _newSegUnit="km";
  const dp=(USER_PLAN[weDay]&&USER_PLAN[weDay][weWorkoutIdx])||{type:"strength"};
  const icon=dp.type==="strength"?"💪":"🏃";
  document.getElementById("we-title").textContent=icon+" "+day;
  document.getElementById("workout-edit-modal").style.display="flex";
  renderWorkoutEdit();
}

  weDay=null;
}

function addExercise(){
  normalizePlan();

  if(!w.exercises) w.exercises=[];
  w.exercises.push({name:"",sets:"3",reps:"10",weight:""});
  renderWorkoutEdit();
}
function removeExercise(idx){
  normalizePlan();
  USER_PLAN[weDay][weWorkoutIdx].exercises.splice(idx,1);
  renderWorkoutEdit();
}
function updateExercise(idx,field,val){
  normalizePlan();
  const w=USER_PLAN[weDay][weWorkoutIdx];
  if(!w||!w.exercises) return;
  w.exercises[idx][field]=val;
}
function setRunType(val){
  normalizePlan();
  USER_PLAN[weDay][weWorkoutIdx].runType=val;
  renderWorkoutEdit();
}
function setWorkoutType(type){
  normalizePlan();
  const w=USER_PLAN[weDay][weWorkoutIdx];
  if(!w) return;
  w.type=type;
  if(type==="strength"&&!w.exercises) w.exercises=[];
  if(type==="run"&&!w.segments) w.segments=[];
  renderWorkoutEdit();
}
function saveWorkoutDay(){
  normalizePlan();
  const w=USER_PLAN[weDay]&&USER_PLAN[weDay][weWorkoutIdx];
  if(w&&w.type==="strength"&&w.exercises){
    w.exercises.forEach(ex=>{
      const k=(ex.name||"").trim().toLowerCase();
      if(k&&(ex.sets||ex.reps||ex.weight)){
        WORKOUT_HIST[k]={sets:ex.sets,reps:ex.reps,weight:ex.weight||"",date:todayStr()};
      }
    });
    save("workout_hist",WORKOUT_HIST);
  }
  save("user_plan",USER_PLAN);
  closeWorkoutEdit();
  toast("✓ "+weDay+" נשמר!");
  renderFitness();
}

// ═══════════════════════════════════════════════
// ACTIVE WORKOUT SESSION
// ═══════════════════════════════════════════════
function startWorkout(day,idx){
  normalizePlan();
  const w=USER_PLAN&&USER_PLAN[day]&&USER_PLAN[day][idx];
  if(!w||w.type!=="strength")return;
  const exs=(w.exercises||[]).map(ex=>({
    name:ex.name||"",
    plannedSets:parseInt(ex.sets)||3,
    plannedReps:ex.reps||"",
    plannedWeight:ex.weight||"",
    sets:Array.from({length:parseInt(ex.sets)||3},()=>({reps:ex.reps||"",weight:ex.weight||"",done:false}))
  }));
  activeWorkout={day,idx,startTime:Date.now(),exercises:exs};
  const modal=document.getElementById("active-workout-modal");
  document.getElementById("awo-title").textContent="💪 "+day;
  modal.style.display="flex";
  clearInterval(_workoutTimerInterval);
  _workoutTimerInterval=setInterval(tickWorkoutTimer,1000);
  renderActiveWorkout();
}

function tickWorkoutTimer(){
  if(!activeWorkout)return;
  const secs=Math.floor((Date.now()-activeWorkout.startTime)/1000);
  const m=Math.floor(secs/60).toString().padStart(2,"0");
  const s=(secs%60).toString().padStart(2,"0");
  const el=document.getElementById("awo-timer");
  if(el)el.textContent=m+":"+s;
}

function renderActiveWorkout(){
  if(!activeWorkout)return;
  let h="";
  activeWorkout.exercises.forEach((ex,ei)=>{
    const prevKey=ex.name.trim().toLowerCase();
    const prev=prevKey&&WORKOUT_HIST[prevKey]?WORKOUT_HIST[prevKey]:null;
    const doneSets=ex.sets.filter(s=>s.done).length;
    const allDone=doneSets===ex.sets.length;
    h+='<div style="background:var(--card);border:1px solid '+(allDone?"rgba(0,212,161,0.3)":"var(--border)")+';border-radius:16px;padding:13px;margin-bottom:12px">';
    h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">';
    h+='<div style="font-size:15px;font-weight:800;flex:1">'+esc(ex.name||"תרגיל")+'</div>';
    h+='<div style="font-size:11px;color:'+(allDone?"var(--teal)":"var(--muted)")+';font-weight:700">'+doneSets+'/'+ex.sets.length+' סטים</div>';
    h+='</div>';
    if(prev){
      const pw=prev.weight?(' @ '+prev.weight+'ק"ג'):'';
      const pd=prev.date?(' · '+prev.date.slice(5).replace('-','/')):'';
      h+='<div style="font-size:10px;color:var(--muted);margin-bottom:9px;display:flex;align-items:center;gap:4px">';
      h+='<span style="color:var(--purple)">↩</span>';
      h+='<span>פעם קודמת: '+(prev.sets||'')+'×'+(prev.reps||'')+pw+pd+'</span>';
      h+='</div>';
    }
    // Column headers
    h+='<div style="display:grid;grid-template-columns:28px 1fr 1fr 36px;gap:5px;margin-bottom:5px;padding:0 2px">';
    h+='<div style="font-size:9px;font-weight:700;color:var(--muted);text-align:center">סט</div>';
    h+='<div style="font-size:9px;font-weight:700;color:var(--muted);text-align:center">ק"ג</div>';
    h+='<div style="font-size:9px;font-weight:700;color:var(--muted);text-align:center">חזרות</div>';
    h+='<div></div>';
    h+='</div>';
    // Sets
    ex.sets.forEach((set,si)=>{
      const done=set.done;
      h+='<div style="display:grid;grid-template-columns:28px 1fr 1fr 36px;gap:5px;margin-bottom:5px;align-items:center">';
      h+='<div style="font-size:12px;font-weight:700;color:'+(done?"var(--teal)":"var(--muted)")+';text-align:center;background:rgba(255,255,255,0.04);border-radius:7px;height:36px;display:flex;align-items:center;justify-content:center">'+(si+1)+'</div>';
      h+='<input type="number" step="0.5" value="'+(set.weight||"")+'" oninput="updateActiveSet('+ei+','+si+',\'weight\',this.value)" class="inp" placeholder="ק\"ג" style="font-size:13px;padding:8px;text-align:center;height:36px;background:'+(done?"rgba(0,212,161,0.07)":"var(--bg3)")+';border-color:'+(done?"rgba(0,212,161,0.3)":"var(--border2)")+'">';
      h+='<input type="number" step="1" value="'+(set.reps||"")+'" oninput="updateActiveSet('+ei+','+si+',\'reps\',this.value)" class="inp" placeholder="חזרות" style="font-size:13px;padding:8px;text-align:center;height:36px;background:'+(done?"rgba(0,212,161,0.07)":"var(--bg3)")+';border-color:'+(done?"rgba(0,212,161,0.3)":"var(--border2)")+'">';
      h+='<button onclick="checkActiveSet('+ei+','+si+')" style="width:36px;height:36px;border-radius:9px;border:2px solid '+(done?"var(--teal)":"rgba(255,255,255,0.2)")+';background:'+(done?"rgba(0,212,161,0.15)":"transparent")+';color:'+(done?"var(--teal)":"var(--muted2)")+';font-size:16px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center">'+(done?"✓":"○")+'</button>';
      h+='</div>';
    });
    h+='<button onclick="addActiveSet('+ei+')" style="width:100%;margin-top:6px;padding:7px;border-radius:9px;border:1px dashed rgba(255,255,255,0.15);background:transparent;color:var(--muted);font-family:Rubik,sans-serif;font-size:11px;font-weight:700;cursor:pointer">+ הוסף סט</button>';
    h+='</div>';
  });
  document.getElementById("awo-content").innerHTML=h;
}

function updateActiveSet(exIdx,setIdx,field,val){
  if(!activeWorkout)return;
  activeWorkout.exercises[exIdx].sets[setIdx][field]=val;
}

function checkActiveSet(exIdx,setIdx){
  if(!activeWorkout)return;
  const set=activeWorkout.exercises[exIdx].sets[setIdx];
  set.done=!set.done;
  renderActiveWorkout();
  if(set.done) startRestTimer(90);
}

function addActiveSet(exIdx){
  if(!activeWorkout)return;
  const ex=activeWorkout.exercises[exIdx];
  const last=ex.sets[ex.sets.length-1]||{reps:ex.plannedReps,weight:ex.plannedWeight};
  ex.sets.push({reps:last.reps,weight:last.weight,done:false});
  renderActiveWorkout();
}

function startRestTimer(secs){
  clearInterval(_restTimerInterval);
  _restSecondsLeft=secs;
  _restTotalSeconds=secs;
  const bar=document.getElementById("awo-rest-bar");
  if(bar){bar.style.display="flex";}
  _updateRestDisplay();
  _restTimerInterval=setInterval(()=>{
    _restSecondsLeft--;
    _updateRestDisplay();
    if(_restSecondsLeft<=0) skipRest();
  },1000);
}

function _updateRestDisplay(){
  const m=Math.floor(_restSecondsLeft/60);
  const s=(_restSecondsLeft%60).toString().padStart(2,"0");
  const el=document.getElementById("awo-rest-time");
  if(el)el.textContent=m+":"+s;
  const inner=document.getElementById("awo-rest-bar-inner");
  if(inner)inner.style.width=Math.max(0,(_restSecondsLeft/_restTotalSeconds)*100)+"%";
}

function skipRest(){
  clearInterval(_restTimerInterval);
  const bar=document.getElementById("awo-rest-bar");
  if(bar)bar.style.display="none";
}

function confirmFinishWorkout(){
  if(!activeWorkout)return;
  const totalSets=activeWorkout.exercises.reduce((a,ex)=>a+ex.sets.length,0);
  const doneSets=activeWorkout.exercises.reduce((a,ex)=>a+ex.sets.filter(s=>s.done).length,0);
  if(doneSets<totalSets){
    if(!confirm('יש עוד '+(totalSets-doneSets)+' סטים שלא סומנו. לסיים בכל זאת?'))return;
  }
  finishWorkoutConfirm();
}

function finishWorkoutConfirm(){
  if(!activeWorkout)return;
  clearInterval(_workoutTimerInterval);
  skipRest();
  const duration=Math.floor((Date.now()-activeWorkout.startTime)/1000);
  // Save last performed set per exercise to WORKOUT_HIST
  activeWorkout.exercises.forEach(ex=>{
    const k=ex.name.trim().toLowerCase();
    if(!k)return;
    const doneSets=ex.sets.filter(s=>s.done);
    const ref=doneSets.length?doneSets[doneSets.length-1]:ex.sets[ex.sets.length-1];
    if(ref&&(ref.reps||ref.weight)){
      WORKOUT_HIST[k]={sets:ex.sets.filter(s=>s.done).length||ex.sets.length,reps:ref.reps||"",weight:ref.weight||"",date:todayStr()};
    }
  });
  save("workout_hist",WORKOUT_HIST);
  const mins=Math.floor(duration/60);
  document.getElementById("active-workout-modal").style.display="none";
  activeWorkout=null;
  toast("🏆 אימון הסתיים! "+mins+" דקות");
  renderFitness();
}
function setNewSegType(t){
  _newSegType=t;
  _newSegUnit=(t==="interval"||t==="rest"||t==="hill")?"m":"km";
  document.querySelectorAll('.seg-type-btn').forEach(btn=>{
    const bv=btn.dataset.segtype;
    const sel=bv===t;
    const col=SEG_COLORS[bv]||"#00D4A1";
    btn.style.background=sel?c2r(col,0.18):"var(--bg3)";
    btn.style.color=sel?col:"var(--muted)";
    btn.style.borderColor=sel?col:"var(--border)";
  });
  const uBtn=document.getElementById("ns-unit-btn");
  if(uBtn)uBtn.textContent=_newSegUnit==="km"?'ק"מ':"מ'";
  const repsEl=document.getElementById("ns-reps");
  if(repsEl){
    const cur=parseInt(repsEl.value)||1;
    if((t==="interval"||t==="rest")&&cur===1)repsEl.value="6";
    else if(t!=="interval"&&t!=="rest"&&cur===6)repsEl.value="1";
  }
}
function toggleSegUnit(){
  _newSegUnit=_newSegUnit==="km"?"m":"km";
  const btn=document.getElementById("ns-unit-btn");
  if(btn)btn.textContent=_newSegUnit==="km"?'ק"מ':"מ'";
}
function addRunSegment(){
  normalizePlan();
  const w=USER_PLAN[weDay][weWorkoutIdx];
  if(!w.segments) w.segments=[];
  const reps=parseInt(document.getElementById('ns-reps')?.value)||1;
  const dist=(document.getElementById('ns-dist')?.value||"").trim();
  const pace=(document.getElementById('ns-pace')?.value||"").trim();
  const hr=(document.getElementById('ns-hr')?.value||"").trim();
  if(!dist){toast("נא להזין מרחק");return;}
  w.segments.push({segType:_newSegType,reps,dist,unit:_newSegUnit,pace,hr});
  _newSegType="warmup";_newSegUnit="km";
  renderWorkoutEdit();
}
function removeRunSegment(i){
  normalizePlan();
  const w=USER_PLAN[weDay][weWorkoutIdx];
  if(w&&w.segments) w.segments.splice(i,1);
  renderWorkoutEdit();
}

function getMuscleBodySVG(primaryMuscle){

  const col=m=>m===primaryMuscle?(MUSCLE_COLORS[m]||"#8B7FFF"):D;
  const chest=col("חזה"),back=col("גב"),shoulders=col("כתפיים"),
        biceps=col("ביצפס"),triceps=col("טריצפס"),legs=col("רגליים"),
        glutes=col("ישבן"),core=col("בטן/ליבה"),calves=col("קאלף"),
        gray="rgba(255,255,255,0.15)";
  return '<svg viewBox="0 0 88 95" width="56" height="60" style="flex-shrink:0">'+
    // FRONT
    '<ellipse cx="20" cy="8" rx="7" ry="7" fill="'+gray+'"/>'+
    '<ellipse cx="9" cy="22" rx="6" ry="5" fill="'+shoulders+'"/>'+
    '<ellipse cx="31" cy="22" rx="6" ry="5" fill="'+shoulders+'"/>'+
    '<rect x="14" y="17" width="12" height="12" rx="3" fill="'+chest+'"/>'+
    '<rect x="4" y="22" width="6" height="14" rx="3" fill="'+biceps+'"/>'+
    '<rect x="30" y="22" width="6" height="14" rx="3" fill="'+biceps+'"/>'+

function renderExPickerList(){
  const container=document.getElementById('ex-list');
  if(!container)return;

  if(_exMuscleFilter)exs=exs.filter(e=>e.muscle===_exMuscleFilter);

function calcProfile(){
  const w=Number(psData.weight)||75;
  const h=Number(psData.height)||175;
  const a=Number(psData.age)||25;
  const bmr=psData.gender==="male"?(10*w+6.25*h-5*a+5):(10*w+6.25*h-5*a-161);
  const tdee=Math.round(bmr*psData.activityLevel);
  let target,protein;
  if(psData.goal==="loss"){const adj=psData.calorieAdjust!=null?psData.calorieAdjust:-500;target=tdee+adj;protein=Math.round(w*2);}
  else if(psData.goal==="muscle"){const adj=psData.calorieAdjust!=null?psData.calorieAdjust:200;target=tdee+adj;protein=Math.round(w*2.2);}
  else{target=tdee;protein=Math.round(w*1.8);}
  const fat=Math.round(target*0.27/9);
  const carbs=Math.round((target-protein*4-fat*9)/4);
  return{...psData,tdee,target,protein,fat,carbs};
}

function psNext1(){
  const name=document.getElementById("ps-name")?.value?.trim();
  const age=document.getElementById("ps-age")?.value;
  const weight=document.getElementById("ps-weight")?.value;
  const height=document.getElementById("ps-height")?.value;
  const err=document.getElementById("ps-err");
  if(!age||!weight||!height){if(err)err.style.display="block";return;}
  psData.name=name;psData.age=Number(age);psData.weight=Number(weight);psData.height=Number(height);
  psStep=2;renderPsStep();
}

function psFinish(){
  const p=calcProfile();
  PROFILE={name:p.name||"",weight:p.weight,tdee:p.tdee,target:p.target,protein:p.protein,carbs:p.carbs,fat:p.fat};
  USER_PLAN={};
  DAYS.forEach(d=>{const t=p.plan[d]||"rest";USER_PLAN[d]=t==="rest"?[]:[{type:t}];});
  save("profile",PROFILE);
  save("user_plan",USER_PLAN);
  if(p.name&&currentUser){
    db.collection("users").doc(currentUser.uid).set({displayName:p.name},{merge:true}).catch(()=>{});
  }
  save("visited",true);
  document.getElementById("profile-setup").style.display="none";
  renderDash();
  toast("ברוך הבא ל-MyWay! 🚀");
}

// ═══════════════════════════════════════════════
// ONBOARDING
// ═══════════════════════════════════════════════
let obStep=0;
function renderObStep(){
  const s=OB_SLIDES[obStep];
  const isLast=obStep===OB_SLIDES.length-1;
  document.getElementById("ob-icon").textContent=s.icon;
  document.getElementById("ob-title").textContent=s.title;
  document.getElementById("ob-desc").innerHTML=s.desc.replace(/\n/g,"<br>");
  document.getElementById("ob-next").textContent=isLast?"🚀 בוא נתחיל!":"הבא ←";
  document.getElementById("ob-back").style.display=obStep===0?"none":"flex";
  const dots=document.getElementById("ob-dots");
  dots.innerHTML=OB_SLIDES.map((_,i)=>'<div style="width:'+(i===obStep?"22px":"8px")+';height:8px;border-radius:4px;background:'+(i===obStep?"var(--purple)":"rgba(255,255,255,0.15)")+';transition:all 0.3s"></div>').join("");
}
function onboardingNext(){
  if(obStep<OB_SLIDES.length-1){obStep++;renderObStep();}
  else finishOnboarding();
}
function onboardingBack(){
  if(obStep>0){obStep--;renderObStep();}
}
function finishOnboarding(){
  document.getElementById("onboarding").style.display="none";
  showProfileSetup();
}

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
document.addEventListener('visibilitychange',function(){
  if(!document.hidden&&currentUser&&currentPg==='dash')renderDash();
});

document.getElementById("loading-screen").style.display="flex";

(async function initAuth(){
  let redirectError=null;
  try{
    const r=await auth.getRedirectResult();
    if(r&&r.user)console.log("redirect login:",r.user.email);
  }catch(e){
    console.error("redirect error:",e);
    redirectError=e;
  }

  auth.onAuthStateChanged(async(user)=>{
    if(user){
      currentUser=user;
      document.getElementById("signin-screen").style.display="none";
      document.getElementById("loading-screen").style.display="flex";
      const isNew=await loadFromFirestore(user.uid);
      document.getElementById("loading-screen").style.display="none";
      updateUserUI(user);
      updateThemeBtn();
      renderDash();
      if(isNew && !load("visited",false)){
        obStep=0;
        document.getElementById("onboarding").style.display="flex";
        renderObStep();
      }
    } else {
      currentUser=null;
      document.getElementById("user-avatar").innerHTML="";
      document.getElementById("loading-screen").style.display="none";
      document.getElementById("signin-screen").style.display="flex";
      if(redirectError){showGoogleAuthError(redirectError);redirectError=null;}
    }
  });
})();
</script>
