[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Keep SDK packages intact: Firestore loads implementation files at runtime.
# Limit this packaging change to Jarvis; existing functions keep their settings.
[functions.jarvis]
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin", "@google-cloud/firestore"]
