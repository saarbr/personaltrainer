[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Bundle Firebase Auth and its ESM dependencies for Lambda's CommonJS runtime.
# Keep the Firestore client external for its runtime-loaded files.
[functions.jarvis]
  node_bundler = "esbuild"
  external_node_modules = ["@google-cloud/firestore"]

[functions."garmin-run-sync"]
  node_bundler = "esbuild"
  external_node_modules = ["@google-cloud/firestore"]

